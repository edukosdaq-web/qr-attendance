var BASE="https://edukosdaq-web.github.io/qr-attendance/qr.html?token=";
function smsHref(p){
  var qr=BASE+encodeURIComponent(p.qr);
  var body="[코스닥협회] "+p.name+"님 공시담당자 보수교육 3차 출석QR 안내입니다.\n출석QR: "+qr+"\n입장 시 핸드폰 QR → 출입카드 순으로 스캔하세요. (문의 02-368-4561~4)";
  return "sms:"+p.phone+"?body="+encodeURIComponent(body);
}
function render(f){
  f=(f||"").trim();
  var arr=DATA.filter(function(p){
    if(!f)return true;
    return (p.name+p.co+p.phone).toLowerCase().indexOf(f.toLowerCase())>=0;
  });
  document.getElementById("cnt").textContent="총 "+arr.length+"명";
  var h=arr.map(function(p){
    return '<div class="card"><div class="info"><div class="nm">'+p.name+'</div><div class="co">'+p.co+'</div><div class="ph">'+p.phone+'</div></div><a class="btn" href="'+smsHref(p)+'">📩 문자</a></div>';
  }).join("");
  document.getElementById("list").innerHTML=h||'<div class="empty">검색 결과 없음</div>';
}
document.getElementById("q").addEventListener("input",function(e){render(e.target.value)});
