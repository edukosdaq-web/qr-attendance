<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>행사장 오시는 길</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --orange: #D4633A;
  --orange-dark: #B8502B;
  --orange-light: #F07A4E;
  --orange-pale: #FDF0EB;
  --orange-mid: #FADADF00;
  --text-dark: #1A1A1A;
  --text-mid: #555;
  --text-light: #999;
  --bg: #F5F0EE;
  --white: #FFFFFF;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --shadow: 0 4px 20px rgba(212,99,58,0.15);
  --shadow-card: 0 2px 12px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text-dark);
}

/* ── HEADER ── */
.header {
  background: var(--orange);
  color: white;
  padding: 20px 20px 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
}

.header::after {
  content: '';
  position: absolute;
  bottom: -20px; left: -20px;
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
}

.header-badge {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 30px;
  padding: 4px 14px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}

.header h1 {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
  position: relative;
  z-index: 1;
}

.header p {
  font-size: 13px;
  margin-top: 6px;
  opacity: 0.85;
  position: relative;
  z-index: 1;
}

/* ── CONTAINER ── */
.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 32px;
}

/* ── SECTION TITLE ── */
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--orange);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--orange);
  opacity: 0.2;
}

/* ── MENU BUTTONS ── */
.menu-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-btn {
  width: 100%;
  background: var(--white);
  border: none;
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-card);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  position: relative;
  overflow: hidden;
}

.menu-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--orange);
  opacity: 0;
  transition: opacity 0.15s;
}

.menu-btn:active { transform: scale(0.98); }
.menu-btn:active::before { opacity: 0.04; }

.menu-icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-sm);
  background: var(--orange-pale);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.menu-text { flex: 1; }

.menu-text strong {
  display: block;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-dark);
  margin-bottom: 3px;
}

.menu-text span {
  font-size: 12px;
  color: var(--text-light);
}

.menu-arrow {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--orange-pale);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--orange);
  font-size: 14px;
  flex-shrink: 0;
}

/* ── PARKING SUB MENU ── */
.parking-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.back-btn-sm {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--white);
  box-shadow: var(--shadow-card);
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-mid);
}

.parking-title {
  font-size: 16px;
  font-weight: 700;
}

.floor-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.floor-btn {
  border: none;
  border-radius: var(--radius-lg);
  padding: 24px 16px;
  cursor: pointer;
  text-align: center;
  box-shadow: var(--shadow-card);
  transition: transform 0.15s ease;
}

.floor-btn:active { transform: scale(0.97); }

.floor-btn.f3 {
  background: var(--orange);
  color: white;
}

.floor-btn.f4 {
  background: var(--white);
  color: var(--text-dark);
}

.floor-btn .floor-num {
  font-size: 28px;
  font-weight: 700;
  display: block;
  line-height: 1.1;
}

.floor-btn .floor-label {
  font-size: 12px;
  margin-top: 6px;
  opacity: 0.8;
}

/* ── SLIDER ── */
.slider-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.route-label {
  flex: 1;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-dark);
}

.step-badge {
  background: var(--orange);
  color: white;
  border-radius: 30px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 700;
}

/* 이미지 카드 */
.img-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  margin-bottom: 14px;
}

.img-wrap {
  display: flex;
  gap: 0;
}

.img-wrap img {
  width: 100%;
  max-height: 380px;
  object-fit: contain;
  display: block;
  background: #f9f4f2;
}

/* 설명 카드 */
.desc-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-card);
  margin-bottom: 16px;
}

.desc-step-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--orange);
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.desc-text {
  font-size: 15px;
  line-height: 1.7;
  color: var(--text-dark);
  white-space: pre-line;
}

/* 내비 버튼 */
.nav-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}

.nav-btn {
  border: none;
  border-radius: var(--radius-md);
  padding: 16px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
  font-family: inherit;
}

.nav-btn:active { transform: scale(0.97); }
.nav-btn:disabled { opacity: 0.35; }

.nav-btn.prev {
  background: var(--white);
  color: var(--orange);
  box-shadow: var(--shadow-card);
  border: 2px solid var(--orange);
}

.nav-btn.next-btn {
  background: var(--orange);
  color: white;
  box-shadow: 0 4px 16px rgba(212,99,58,0.35);
}

.restart-btn {
  width: 100%;
  border: none;
  border-radius: var(--radius-md);
  padding: 14px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  color: var(--text-light);
  text-decoration: underline;
  font-family: inherit;
}

/* 진행 점 */
.dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin: 12px 0;
}

.dot {
  width: 6px; height: 6px;
  border-radius: 3px;
  background: #ddd;
  transition: all 0.2s ease;
}

.dot.active {
  background: var(--orange);
  width: 18px;
}

/* 숨기기 */
.hidden { display: none !important; }

/* 페이드인 */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.anim { animation: fadeUp 0.25s ease both; }

</style>
</head>
<body>

<div class="header">
  <div class="header-badge">📍 오시는 길 안내</div>
  <h1>2026년 공시담당임원 전문연수<br>제1차 오프라인 (서울)</h1>
  <p>JW 매리어트 호텔 서울 · 5층 행사장</p>
</div>

<!-- ① 메인 메뉴 -->
<div class="container" id="menu">
  <div class="section-title">출발 위치 선택</div>
  <div class="menu-list">
    <button class="menu-btn" onclick="start('lobby')">
      <div class="menu-icon">🏨</div>
      <div class="menu-text">
        <strong>호텔 로비에서</strong>
        <span>로비 입장 후 행사장 이동</span>
      </div>
      <div class="menu-arrow">›</div>
    </button>
    <button class="menu-btn" onclick="showParking()">
      <div class="menu-icon">🅿️</div>
      <div class="menu-text">
        <strong>센트럴시티 주차장에서</strong>
        <span>지하 3층 / 지하 4층 선택</span>
      </div>
      <div class="menu-arrow">›</div>
    </button>
    <button class="menu-btn" onclick="start('subway')">
      <div class="menu-icon">🚇</div>
      <div class="menu-text">
        <strong>고속터미널역에서</strong>
        <span>지하철 이용 시</span>
      </div>
      <div class="menu-arrow">›</div>
    </button>
  </div>
</div>

<!-- ② 주차층 선택 -->
<div class="container hidden" id="parkingMenu">
  <div class="parking-header">
    <button class="back-btn-sm" onclick="home()">‹</button>
    <div class="parking-title">주차 층수를 선택하세요</div>
  </div>
  <div class="floor-grid">
    <button class="floor-btn f3" onclick="start('b3')">
      <span class="floor-num">B3</span>
      <div class="floor-label">지하 3층</div>
    </button>
    <button class="floor-btn f4" onclick="start('b4')">
      <span class="floor-num">B4</span>
      <div class="floor-label">지하 4층</div>
    </button>
  </div>
</div>

<!-- ③ 슬라이드 -->
<div class="container hidden" id="slider">

  <div class="slider-header">
    <button class="back-btn-sm" onclick="home()">‹</button>
    <div class="route-label" id="routeLabel"></div>
    <div class="step-badge" id="stepBadge">1 / 8</div>
  </div>

  <div class="img-card">
    <div class="img-wrap" id="imgBox"></div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="desc-card">
    <div class="desc-step-num" id="stepNum">STEP 1</div>
    <div class="desc-text" id="desc"></div>
  </div>

  <div class="nav-row">
    <button class="nav-btn prev" id="prevBtn" onclick="prev()">← 이전</button>
    <button class="nav-btn next-btn" id="nextBtn" onclick="next()">다음 →</button>
  </div>

  <button class="restart-btn" onclick="home()">↩ 출발지 다시 선택</button>
</div>

<script>
let slides = [], idx = 0;

const routeNames = {
  lobby: '🏨 호텔 로비에서',
  b3:    '🅿️ 주차장 지하 3층에서',
  b4:    '🅿️ 주차장 지하 4층에서',
  subway:'🚇 고속터미널역에서'
};

const allSlides = {
  lobby: [
    { imgs:["images/lobby01.png"], text:"호텔 정문을 통해 입장하십시오.\n(*입장 후 바로 왼쪽에 컨시어지 데스크 위치)" },
    { imgs:["images/lobby02.png"], text:"조형물을 기준으로 왼편 혹은 구조물 뒷편으로 돌아 오십시오.\n(*통과 후 오른쪽에 스탠딩 디지털 사이니지 위치)" },
    { imgs:["images/lobby03.png","images/lobby04.png"], text:"에스컬레이터를 이용하거나 엘리베이터에 탑승하시어 5층 행사장으로 올라오십시오." }
  ],
  b3: [
    { imgs:["images/parking_b3_01.png"], text:"지하 3층 F, G, H 구역이 호텔 출입구와 가깝습니다." },
    { imgs:["images/parking_b3_02.png"], text:"지하 3층 F구역 쪽에 위치한 JW MARRIOTT 간판을 확인하세요." },
    { imgs:["images/parking_b3_03.png"], text:"호텔 화살표를 따라 이동해주세요.\n바로 보이는 엘리베이터는 백화점 전용입니다." },
    { imgs:["images/parking_b3_04.png"], text:"왼쪽에 보이는 호텔 전용문으로 통과해주세요." },
    { imgs:["images/parking_b3_05.png"], text:"안쪽에 있는 엘리베이터 3대가 호텔 전용엘리베이터입니다.\n행사장(5층)으로 이동해주세요." },
    { imgs:["images/parking_b3_06.png"], text:"5층 행사장으로 바로 도착합니다." }
  ],
  b4: [
    { imgs:["images/parking_b4_01.png"], text:"지하 4층 F, G, H 구역이 호텔 출입구와 가깝습니다." },
    { imgs:["images/parking_b4_02.png"], text:"지하 4층 F구역 쪽에 위치한 JW MARRIOTT 간판을 확인하세요." },
    { imgs:["images/parking_b4_03.png"], text:"호텔 & 백화점 화살표를 따라 이동해주세요." },
    { imgs:["images/parking_b4_04.png"], text:"엘리베이터 문을 통과하여 주세요." },
    { imgs:["images/parking_b4_05.png"], text:"지하 4층 엘리베이터를 타고 2층(JW MARRIOTT)에서 내려주세요." },
    { imgs:["images/parking_b4_06.png"], text:"2층에서 내린 후 오른쪽 방향 불가리 쪽으로 걸어가주세요." },
    { imgs:["images/parking_b4_07.png"], text:"사이 통로를 확인하여 호텔 로비로 들어와주세요." },
    { imgs:["images/parking_b4_08.png"], text:"호텔 로비가 나오면 엘리베이터 혹은 에스컬레이터를 이용하여 행사장으로 와주세요." }
  ],
  subway: [
    { imgs:["images/subway01.png"], text:"7번 출구 방향으로 오셔서 ABC 마트가 보이면 우회전하십시오." },
    { imgs:["images/subway02.png"], text:"SHINSEGAE 출입구로 통과하여 왼쪽으로 직진하십시오." },
    { imgs:["images/subway03.png"], text:"호남선 터미널(신세계 센트럴시티) 방면으로 좌회전하십시오." },
    { imgs:["images/subway04.png"], text:"올라가는 두 개의 에스컬레이터 중 큰 에스컬레이터를 이용하시어 두 층 올라가십시오." },
    { imgs:["images/subway05.png"], text:"백화점 2층 에스컬레이터에서 내리시면 좌회전하십시오." },
    { imgs:["images/subway06.png"], text:"BVLGARI 매장을 따라 우측 통로로 진입하십시오." },
    { imgs:["images/subway07.png"], text:"SHINSEGAE 출입구로 입장하십시오." },
    { imgs:["images/subway08.png"], text:"호텔 로비가 보이시면 에스컬레이터를 이용하거나 엘리베이터에 탑승하시어 5층 행사장으로 올라오십시오." }
  ]
};

function start(type) {
  slides = allSlides[type];
  idx = 0;
  document.getElementById('routeLabel').textContent = routeNames[type];
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('parkingMenu').classList.add('hidden');
  document.getElementById('slider').classList.remove('hidden');
  render();
}

function render() {
  // 이미지
  const box = document.getElementById('imgBox');
  box.innerHTML = '';
  slides[idx].imgs.forEach(src => {
    const img = document.createElement('img');
    img.src = src;
    img.style.width = slides[idx].imgs.length > 1 ? '50%' : '100%';
    box.appendChild(img);
  });

  // 텍스트
  document.getElementById('desc').textContent = slides[idx].text;
  document.getElementById('stepBadge').textContent = (idx + 1) + ' / ' + slides.length;
  document.getElementById('stepNum').textContent = 'STEP ' + (idx + 1);

  // 점
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === idx ? ' active' : '');
    dotsEl.appendChild(d);
  });

  // 버튼 상태
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === slides.length - 1;

  // 애니
  box.classList.remove('anim');
  void box.offsetWidth;
  box.classList.add('anim');
}

function next() { if (idx < slides.length - 1) { idx++; render(); } }
function prev() { if (idx > 0) { idx--; render(); } }

function showParking() {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('parkingMenu').classList.remove('hidden');
}

function home() {
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('parkingMenu').classList.add('hidden');
  document.getElementById('slider').classList.add('hidden');
}

// 스와이프
let sx = 0;
document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const ex = e.changedTouches[0].clientX;
  if (sx - ex > 50) next();
  if (ex - sx > 50) prev();
});
</script>
</body>
</html>
