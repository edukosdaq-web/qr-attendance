/* ═══════════════════════════════════════════
   Attendance
   ═══════════════════════════════════════════ */
function AttendancePage({training,participants,attendanceRecords,showToast,showScanResult,cards,loadAttendance,setAttendance,setCards,setParticipants,loadCards}){
  const [day,setDay]=useState(1);
  const [session,setSess]=useState('AM');
  const [qrInput,setQr]=useState('');
  const [showManual,setShowManual]=useState(false);
  const [scanning,setScanning]=useState(false);
  const inputRef=useRef();
  const scanTimerRef=useRef(null);

  useFocusLock(inputRef,!showManual&&!cardMappingTarget);

  // 카드 매핑 대기 상태: 출석 후 카드 스캔 대기
  const [cardMappingTarget,setCardMappingTarget]=useState(null); // 출석 완료된 참가자 — 카드 스캔 대기 중

  const processAttendance=async(target,method='scanner')=>{
    const existing=attendanceRecords.find(a=>a.participantId===target.id&&a.day===day&&a.session===session);
    if(existing){showScanResult('duplicate','⚠️',target.name,`이미 출석 (${new Date(existing.checkedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})})`);setQr('');return}

    // 낙관적 UI: 즉시 출석 표시
    const nowTime=new Date();
    const optimisticAtt={id:'opt_'+Date.now(),participantId:target.id,trainingId:training.id,day,session,checkedAt:nowTime.toISOString(),method,late:false};
    setAttendance(prev=>[...prev,optimisticAtt]);
    setQr('');

    // AM: 바로 카드 스캔 모달 (매일 새로 매핑)
    setCardMappingTarget(target);setQr('');

    // 백그라운드 서버 저장 (낙관적 UI 이미 반영됨, 재조회 안 함)
    try{
      const res=await apiPost({action:'scan',qrCode:target.qrCode,day,session,method});
      if(res.status!=='ok'){
        setAttendance(prev=>prev.filter(a=>a.id!==optimisticAtt.id));
        showScanResult('error','❌',target.name,res.error||res.message||'서버 저장 실패');
        setCardMappingTarget(null);
      }
    }catch(e){
      showToast('⚠️ 오프라인: '+target.name+' 출석은 로컬 저장됨');
    }
  };

  // 카드 처리: AM→매핑, PM 마지막날→반납+수료
  const processCardMapping=async(cardCode)=>{
    if(!cardMappingTarget)return;
    const target=cardMappingTarget;
    // target 초기화를 성공 시점까지 지연 (잘못된 카드 스캔 시 재시도 가능하도록)
    setQr('');
    
    if(session==='PM'&&isLastDay){
      // 마지막날 PM: 설문 확인 없이 서버에서 모든 것을 처리
      // 서버의 returnCard가 설문확인 + 출석 + 반납 + 수료 판단 모두 수행
      setCardMappingTarget(null);
      showScanResult('info','⏳',target.name,'카드 반납 + 수료 처리 중...');
      try{
        const res=await apiPost({action:'returnCard',cardId:cardCode,day:day});
        if(res.status==='ok'){
          const d=res.data||{};
          const optAtt={id:'opt_'+Date.now(),participantId:target.id,trainingId:training.id,day,session:'PM',checkedAt:new Date().toISOString(),method:'card-return'};
          setAttendance(prev=>[...prev,optAtt]);
          setCards(prev=>prev.map(c=>c.participantId===target.id&&c.status==='mapped'?{...c,status:'returned'}:c));
          const graduated=d.수료?.수료처리됨||d.graduated;
          if(graduated){
            setParticipants(prev=>prev.map(p=>p.id===target.id?{...p,graduated:true,surveyCompleted:true}:p));
            showScanResult('success','🎓',target.name,'🎓 수료 완료! 축하합니다!');
          }else if(d.수료?.미충족사유){
            showScanResult('error','⚠️',target.name,'수료 미충족: '+d.수료.미충족사유);
          }else{
            showScanResult('success','✅',target.name,'카드 반납 + 오후 출석 완료');
          }
          showToast(`💳 ${target.name} 카드 반납 완료`);
        }else{
          showScanResult('error','❌',target.name,res.message||'카드 반납 실패');
          setCardMappingTarget(target);
        }
      }catch(e){
        showScanResult('error','❌',target.name,'서버 오류: '+(e.message||'연결 실패'));
        setCardMappingTarget(target);
      }
    }else{
      // AM: 카드 매핑 (기존 로직)
      setCardMappingTarget(null);
      showScanResult('success','✅',target.name,'출석 완료 + 카드 매핑');
      const optimisticCard={id:'optC_'+Date.now(),qrCode:cardCode,status:'mapped',participantId:target.id,participantName:target.name,mappedAt:new Date().toISOString()};
      setCards(prev=>[...prev,optimisticCard]);
      try{
        await apiPost({action:'mapCard',cardId:cardCode,participantId:target.id,day:day,session:'AM'});
        showToast(`🔗 ${target.name} ← ${cardCode} 매핑 완료`);
      }catch(e){
        setCards(prev=>prev.filter(c=>c.id!==optimisticCard.id));
        showToast('⚠️ 카드 매핑 실패: '+e.message);
      }
    }
  };

  const isLastDay=day===training.days;

  // PM 비마지막날: 카드 QR로 직접 반납+PM출석 (낙관적 UI)
  const processCardReturnPM=async(cardCode)=>{
    // 1) 먼저 카드매핑 데이터에서 오늘 매핑된 카드 확인 (낙관적 포함)
    const cUp=cardCode.toUpperCase();
    const mapped=cards.find(c=>(c.qrCode===cardCode||c.qrCode?.toUpperCase()===cUp)&&c.status==='mapped');
    // 2) 낙관적 cards에 없으면 서버에서 확인
    if(!mapped){
      setQr('');
      showScanResult('info','⏳','확인 중','서버에서 카드 매핑 확인 중...');
      try{
        const res=await apiPost({action:'returnCard',cardId:cardCode,day:day});
        if(res.status==='ok'){
          const d=res.data||res;
          const pName=d.참가자이름||d.name||'';
          showScanResult('success','✅',pName,`오후 출석 + 카드 반납 완료`);
          showToast(`💳 ${pName} 반납 완료`);
          // 출석 낙관적 추가
          if(d.participantId){
            const optAtt={id:'opt_'+Date.now(),participantId:d.participantId,trainingId:training.id,day,session:'PM',checkedAt:new Date().toISOString(),method:'card-return'};
            setAttendance(prev=>[...prev,optAtt]);
          }
          loadCards();
        }else{
          showScanResult('error','❌','카드 오류',res.message||'오늘 매핑된 카드가 아닙니다');
        }
      }catch(e){
        showScanResult('error','❌','네트워크 오류','서버 연결 실패');
      }
      return;
    }
    // 로컬에서 찾은 경우: 기존 낙관적 UI
    const pName=participants.find(p=>p.id===mapped.participantId)?.name||'';
    showScanResult('success','✅',pName,`오후 출석 + 카드 반납`);
    showToast(`💳 ${pName} 반납 완료`);
    setCards(prev=>prev.map(c=>c.id===mapped.id?{...c,status:'returned'}:c));
    const optAtt={id:'opt_'+Date.now(),participantId:mapped.participantId,trainingId:training.id,day,session:'PM',checkedAt:new Date().toISOString(),method:'card-return'};
    setAttendance(prev=>[...prev,optAtt]);
    setQr('');
    // 백그라운드 API
    try{
      const res=await apiPost({action:'returnCard',cardId:cardCode,day:day});
      if(res.status!=='ok'){
        showScanResult('error','❌','처리 실패',res.message||'카드 반납 실패');
        setCards(prev=>prev.map(c=>c.id===mapped.id?{...c,status:'mapped'}:c));
      }
    }catch(e){
      showScanResult('error','❌','네트워크 오류','서버 연결 실패');
    }
  };

  const processQR=async(rawCode)=>{
    const code=rawCode.replace(/[\r\n\t]/g,'').trim();
    console.log('[QR] input:', JSON.stringify(code), 'len:', code.length);

    // 카드 매핑/반납 대기 중이면 카드 처리
    if(cardMappingTarget){
      processCardMapping(code);
      return;
    }

    // ── PM 비마지막날: 카드 QR만 스캔 → 반납+PM출석 ──
    if(session==='PM'&&!isLastDay){
      // 카드 QR이면 직접 반납 처리
      if(code.toUpperCase().startsWith('KOSDAQ-C')){
        processCardReturnPM(code);
        return;
      }
      // 참가자 QR이 스캔되면 안내
      const pMatch=participants.find(p=>p.qrCode===code||p.qrCode?.toUpperCase()===code.toUpperCase());
      if(pMatch){
        showScanResult('info','ℹ️',pMatch.name,'오후에는 카드 QR만 스캔하세요 (카드 반납)');
        setQr('');
        return;
      }
      // 기타: 서버에서 카드 반납 시도
      processCardReturnPM(code);
      return;
    }

    // ── PM 마지막날: 참가자 QR 먼저 → 카드 스캔 ──
    if(session==='PM'&&isLastDay){
      // 참가자 QR 찾기
      let target=participants.find(p=>p.qrCode===code||p.qrCode?.toUpperCase()===code.toUpperCase());
      if(target){
        const existing=attendanceRecords.find(a=>a.participantId===target.id&&a.day===day&&a.session==='PM');
        if(existing){showScanResult('duplicate','⚠️',target.name,'이미 오후 출석 처리됨');setQr('');return}
        setCardMappingTarget(target);setQr('');
        return;
      }
      // 카드 QR이 먼저 스캔된 경우
      if(code.toUpperCase().startsWith('KOSDAQ-C')){
        showScanResult('error','⚠️','순서 오류','마지막 날에는 참가자 QR을 먼저 스캔해주세요');
        setQr('');
        return;
      }
      showScanResult('error','❌','미등록','등록되지 않은 QR');
      setQr('');
      return;
    }

    // ── AM: 기존 로직 ──
    let target=participants.find(p=>p.qrCode===code||p.qrCode?.toUpperCase()===code.toUpperCase());
    if(!target){
      const codeUpper=code.toUpperCase();
      let card=cards.find(c=>(c.qrCode===code||c.qrCode?.toUpperCase()===codeUpper)&&c.status==='mapped');
      if(!card){try{await loadCards()}catch(e){}}
      if(card){target=participants.find(p=>p.id===card.participantId);}
      if(!target){
        setScanning(true);
        try{
          const res=await apiPost({action:'scan',qrCode:code,day,session,method:'scanner'});
          if(res.status==='ok'){
            const d=res.data||res;
            const pName=d.이름||d.name||'';
            const pCompany=d.회사||d.company||'';
            showScanResult('success','✅',pName||'출석 완료',`${pCompany} · ${day}일차 오전`);
            await loadAttendance(training.id,day);
          }else{
            showScanResult('error','❌','처리 실패',res.error||res.message||'미등록 QR');
          }
        }catch(e){
          showScanResult('error','❌','네트워크 오류','서버 연결 실패');
        }finally{setScanning(false);setQr('')}
        return;
      }
    }
    processAttendance(target);
  };

  const present=attendanceRecords.filter(a=>a.day===day&&a.session===session);

  // Load attendance when day changes
  useEffect(()=>{loadAttendance(training.id,day)},[day]);

  return(
    <div>
      <h1 className="text-2xl font-bold mb-5">✅ 출석 체크</h1>
      {/* ── 세션별 안내 배너 ── */}
      {/* AM 오전 입실 */}
      {session==='AM'&&<div className="bg-green-50 border border-green-300 rounded-xl p-4 mb-4 text-center">
        <div className="text-sm text-green-700">☀️ <strong>오전 입실</strong> — 참가자 QR 스캔 → 출입카드 스캔 → 출석 + 카드 수령</div>
      </div>}
      {/* PM 비마지막날 오후 퇴실 */}
      {!isLastDay&&session==='PM'&&<div className="bg-blue-50 border border-blue-300 rounded-xl p-4 mb-4 text-center">
        <div className="text-sm text-blue-700">🌙 <strong>오후 퇴실</strong> — 카드 QR만 스캔하면 오후 출석 + 카드 반납이 자동 처리됩니다.</div>
      </div>}
      {/* PM 마지막날 오후 수료 */}
      {isLastDay&&session==='PM'&&<div className="bg-amber-50 border-2 border-amber-400 rounded-2xl p-6 mb-4 text-center">
        <div className="text-4xl mb-3">📋</div>
        <div className="text-xl font-bold text-amber-800 mb-2">마지막 날 오후 — 수료 처리</div>
        <div className="text-base text-amber-700 leading-relaxed">
          <strong>문자메세지로 받으신 QR을 찍어야만 수료가 됩니다.</strong><br/>
          <strong>설문조사 완료 후 QR을 찍어주세요.</strong>
        </div>
        <div className="text-sm text-amber-600 mt-3">참가자 QR → 카드 QR 순서로 스캔</div>
      </div>}
      <div className="bg-white rounded-xl p-4 mb-4 shadow-sm">
        <div className="flex flex-wrap gap-4 items-center">
          <div>
            <label className="text-xs font-semibold block mb-1">일차</label>
            <div className="flex gap-2">{Array.from({length:training.days},(_,i)=>i+1).map(d=><button key={d} className={`px-4 py-2 rounded-lg font-semibold text-sm ${day===d?'bg-blue-600 text-white':'border'}`} onClick={()=>setDay(d)}>Day {d}</button>)}</div>
          </div>
          <div>
            <label className="text-xs font-semibold block mb-1">시간대</label>
            <div className="flex gap-2">
              <button className={`px-4 py-2 rounded-lg font-semibold text-sm ${session==='AM'?'bg-blue-600 text-white':'border'}`} onClick={()=>setSess('AM')}>☀️ 오전</button>
              <button className={`px-4 py-2 rounded-lg font-semibold text-sm ${session==='PM'?'bg-blue-600 text-white':'border'}`} onClick={()=>setSess('PM')}>🌙 오후</button>
            </div>
          </div>
          <div className="ml-auto text-center">
            <div className="text-xs text-gray-500">출석률</div>
            <div className="text-3xl font-bold text-blue-600">{present.length}/{participants.length}</div>
          </div>
        </div>
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        <div>
          <div className="bg-white rounded-xl p-5 shadow-sm mb-4">
            <h3 className="text-sm font-semibold text-gray-500 mb-3">📱 QR 스캔</h3>
            <input ref={inputRef} type="text" className="scanner-input w-full px-4 py-3 border rounded-lg" value={qrInput} onChange={e=>{const v=e.target.value;setQr(v);if(scanTimerRef.current)clearTimeout(scanTimerRef.current);const trimmed=v.trim();if(trimmed.length>=10){scanTimerRef.current=setTimeout(()=>{if(!scanning){processQR(trimmed);setQr('')}},400)}}} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();const v=qrInput.trim();if(v&&!scanning){if(scanTimerRef.current)clearTimeout(scanTimerRef.current);processQR(v);setQr('')}}}} placeholder="카드 QR 또는 참가자 QR 스캔..." autoFocus/>
            <div className="flex gap-2 mt-3">
              <button className="px-3 py-1 border rounded text-xs" onClick={()=>setShowManual(true)}>🔍 수동 검색</button>
              <button className="px-3 py-1 border rounded text-xs" onClick={()=>loadAttendance(training.id,day).then(()=>showToast('🔄 새로고침'))}>🔄 새로고침</button>
            </div>
          </div>
        </div>
        <div className="bg-white rounded-xl p-5 shadow-sm">
          <h3 className="text-sm font-semibold text-gray-500 mb-3">실시간 현황 ({day}일차 {session==='AM'?'오전':'오후'})</h3>
          <div className="max-h-96 overflow-y-auto">
            <table className="w-full text-sm"><thead><tr className="text-xs text-gray-500 bg-gray-50"><th className="text-left p-2">이름</th><th className="text-left p-2">소속</th><th className="p-2">카드</th><th className="p-2">상태</th><th className="p-2">시각</th></tr></thead>
              <tbody>{participants.map(p=>{
                const att=present.find(a=>a.participantId===p.id);
                const card=cards.find(c=>c.participantId===p.id&&c.status==='mapped');
                const cardLabel=card?card.qrCode.replace('KOSDAQ-C-','C-'):'—';
                return <tr key={p.id} className="border-t"><td className="p-2 font-semibold">{p.name}</td><td className="p-2 text-gray-500 text-xs">{p.company}</td>
                  <td className="p-2 text-center text-xs font-mono">{cardLabel}</td>
                  <td className="p-2 text-center">{att?<span className="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded-full">출석</span>:<span className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">미출석</span>}</td>
                  <td className="p-2 text-center text-xs">{att?new Date(att.checkedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'-'}</td></tr>;
              })}</tbody>
            </table>
          </div>
        </div>
      </div>
      {showManual&&<ManualSearch participants={participants} title="수동 출석" onClose={()=>setShowManual(false)} onSelect={p=>{processAttendance(p,'manual');setShowManual(false)}}/>}
      {cardMappingTarget&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={()=>{setCardMappingTarget(null)}}>
        <div className="bg-white rounded-2xl p-8 shadow-2xl text-center max-w-md mx-4 relative" onClick={e=>e.stopPropagation()}>
          <button className="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl" onClick={()=>setCardMappingTarget(null)}>✕</button>
          <div className="text-5xl mb-3">{isLastDay&&session==='PM'?'🎓':'🪪'}</div>
          <div className="text-xl font-bold mb-1">{cardMappingTarget.name}</div>
          <div className="text-sm text-gray-500 mb-4">{cardMappingTarget.company}</div>
          <div className="text-lg font-semibold text-blue-600 mb-2">
            {isLastDay&&session==='PM'?'출입카드를 반납하세요 (수료 처리)':'출입카드를 스캔하세요'}
          </div>
          <div className="text-sm text-gray-400 mb-4">
            {isLastDay&&session==='PM'?'카드 QR 스캔 → 오후 출석 + 카드 반납 + 수료 판단':'카드 QR을 스캔하면 자동 매핑됩니다'}
          </div>
          <input type="text" className="scanner-input w-full px-4 py-3 border rounded-lg text-center mb-4" value={qrInput} onChange={e=>{const v=e.target.value;setQr(v);if(scanTimerRef.current)clearTimeout(scanTimerRef.current);const trimmed=v.trim();if(trimmed.length>=5){scanTimerRef.current=setTimeout(()=>{processCardMapping(trimmed);setQr('')},400)}}} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();const v=qrInput.trim();if(v){processCardMapping(v);setQr('')}}}} placeholder={isLastDay&&session==='PM'?'카드 QR 스캔 → 수료 처리':'카드 QR 스캔 대기...'} autoFocus/>
          {session==='AM'&&<button className="px-6 py-2 bg-gray-200 rounded-lg text-sm font-medium" onClick={()=>{setCardMappingTarget(null);showScanResult('success','✅',cardMappingTarget.name,'출석 완료 (카드 없이)')}}>건너뛰기</button>}
        </div>
      </div>}
    </div>
  );
}

/* ═══════════════════════════════════════════
   Completion
   ═══════════════════════════════════════════ */
function CompletionPage({training,participants,attendanceRecords,cards,showToast,showScanResult,loadParticipants,loadCards,loadAttendance}){
  const [qrInput,setQr]=useState('');
  const [target,setTarget]=useState(null);
  const [cardQr,setCardQr]=useState('');
  const [showManual,setShowManual]=useState(false);
  const [tab,setTab]=useState('completion');
  const [exitReason,setExitReason]=useState('개인사정');
  const [exitMemo,setExitMemo]=useState('');
  const [processing,setProcessing]=useState(false);
  const inputRef=useRef();
  const cardRef=useRef();

  useFocusLock(inputRef,!target&&!showManual);

  const totalSessions=training.days*2;
  const minSessions=Math.ceil(totalSessions*2/3);
  const getAttCount=(pid)=>attendanceRecords.filter(a=>a.participantId===pid).length;

  const resolveTarget=(code)=>{
    let t=participants.find(p=>p.qrCode===code);
    if(!t){const c=cards.find(c=>c.qrCode===code&&c.status==='mapped');if(c)t=participants.find(p=>p.id===c.participantId)}
    if(!t){showScanResult('error','❌','미등록','등록되지 않은 QR');setQr('');return}
    setTarget(t);setQr('');
    setTimeout(()=>cardRef.current?.focus(),50);
  };

  const processCompletion=async()=>{
    if(!target||processing)return;
    if(target.certificateIssued){showScanResult('duplicate','⚠️',target.name,'이미 수료 처리됨');reset();return}
    const attCount=getAttCount(target.id);
    const surveyOk=target.surveyCompleted;

    setProcessing(true);
    try{
      // Return card if scanned
      let returnResult = null;
      if(cardQr){
        const retRes = await apiPost({action:'returnCard',cardId:cardQr});
        if(retRes.status==='ok') returnResult = retRes.data;
      }
      if(returnResult && returnResult.수료 && returnResult.수료.수료처리됨){
        showScanResult('success','🎓',target.name,'수료 완료! 카드 반납됨');
        await Promise.all([loadParticipants(training.id),loadCards()]);
      }else if(surveyOk&&attCount>=minSessions){
        showScanResult('success','🎓',target.name,'수료 완료! 수료증 생성 가능');
        await Promise.all([loadParticipants(training.id),loadCards()]);
      }else{
        const reasons=[];
        if(!surveyOk)reasons.push('설문 미완료');
        if(attCount<minSessions)reasons.push(`출석 부족(${attCount}/${totalSessions})`);
        showScanResult('error','❌',target.name,reasons.join(', '));
      }
    }catch(e){
      showToast('❌ 처리 중 오류','err');
    }finally{setProcessing(false);setTimeout(reset,1000)}
  };

  const processEarlyExit=async()=>{
    if(!target||processing)return;
    setProcessing(true);
    try{
      // Return card
      const pCard=cards.find(c=>c.participantId===target.id&&c.status==='mapped');
      if(pCard){
        await apiPost({action:'returnCard',cardId:pCard.qrCode});
      }
      showScanResult('success','🚪',target.name,`중도퇴장 (${exitReason})`);
      await loadCards();
    }catch(e){
      showToast('❌ 처리 중 오류','err');
    }finally{setProcessing(false);setTimeout(reset,1000)}
  };

  const toggleSurvey=async(pid)=>{
    try{
      await apiPost({action:'markSurvey',participantId:pid});
      await loadParticipants(training.id);
      showToast('✅ 설문 상태 변경');
    }catch(e){showToast('❌ 오류','err')}
  };

  const generateCertificate=(p)=>{
    try{
      const {jsPDF}=window.jspdf;
      const doc=new jsPDF('landscape','mm','a4');
      doc.setFontSize(36);doc.text('수 료 증',148,60,{align:'center'});
      doc.setFontSize(20);doc.text(p.name,148,90,{align:'center'});
      doc.setFontSize(14);doc.text(`소속: ${p.company}${p.position?' / '+p.position:''}`,148,110,{align:'center'});
      doc.text(`연수: ${training.name}`,148,125,{align:'center'});
      doc.text(`기간: ${training.startDate} ~ ${training.endDate}`,148,140,{align:'center'});
      doc.text(`위 사람은 본 연수과정을 수료하였음을 증명합니다.`,148,165,{align:'center'});
      doc.text(new Date().toLocaleDateString('ko-KR'),148,185,{align:'center'});
      doc.text('코스닥협회장',148,200,{align:'center'});
      doc.save(`수료증_${p.name}.pdf`);
      showToast('📄 수료증 PDF 생성 완료');
    }catch(e){showToast('❌ PDF 생성 오류: '+e.message,'err')}
  };

  const reset=()=>{setTarget(null);setQr('');setCardQr('');setExitReason('개인사정');setExitMemo('')};

  const survDone=participants.filter(p=>p.surveyCompleted).length;
  const certDone=participants.filter(p=>p.certificateIssued).length;

  return(
    <div>
      <h1 className="text-2xl font-bold mb-5">🎓 수료 처리</h1>
      <div className="bg-yellow-50 border border-yellow-300 rounded-xl p-3 mb-4 text-sm">📌 <strong>수료 조건:</strong> 전체 {totalSessions}세션 중 {minSessions}개 이상 출석 + 설문 완료</div>
      <div className="grid grid-cols-3 gap-3 mb-4">
        <StatCard title="설문 완료" value={survDone} icon="📝" color="blue"/>
        <StatCard title="수료 발급" value={certDone} icon="🎓" color="green"/>
        <StatCard title="카드 반납" value={cards.filter(c=>c.returnedAt&&participants.some(p=>p.id===c.participantId)).length} icon="💳"/>
      </div>
      <div className="flex gap-2 mb-4 border-b pb-2">
        <button className={`px-4 py-2 font-semibold text-sm rounded-t ${tab==='completion'?'bg-blue-600 text-white':'border'}`} onClick={()=>{setTab('completion');reset()}}>🎓 수료 처리</button>
        <button className={`px-4 py-2 font-semibold text-sm rounded-t ${tab==='exit'?'bg-orange-500 text-white':'border'}`} onClick={()=>{setTab('exit');reset()}}>🚪 중도퇴장</button>
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        <div className="bg-white rounded-xl p-5 shadow-sm">
          {tab==='completion'?(
            !target?(
              <div>
                <h3 className="text-sm font-semibold text-gray-500 mb-3">참가자 QR 스캔</h3>
                <input ref={inputRef} type="text" className="scanner-input w-full px-4 py-3 border rounded-lg" value={qrInput} onChange={e=>setQr(e.target.value.trim())} onKeyDown={e=>{if(e.key==='Enter'&&qrInput)resolveTarget(qrInput)}} placeholder="참가자 QR 스캔..." autoFocus/>
                <div className="flex gap-2 mt-3">
                  <button className="px-3 py-1 border rounded text-xs" onClick={()=>setShowManual(true)}>🔍 수동 검색</button>
                </div>
              </div>
            ):(
              <div>
                <div className="bg-gray-50 p-4 rounded-xl mb-4">
                  <div className="flex justify-between items-center">
                    <div><div className="text-xl font-bold">{target.name}</div><div className="text-sm text-gray-500">{target.company}</div></div>
                    <button className="px-3 py-1 border rounded text-xs" onClick={reset}>✕ 취소</button>
                  </div>
                  <div className="mt-3 space-y-1 text-sm">
                    <div className={target.surveyCompleted?'text-green-600':'text-red-600 font-bold'}>{target.surveyCompleted?'✅ 설문 완료':'❌ 설문 미완료'} {!target.surveyCompleted&&<button className="ml-2 px-2 py-0.5 bg-yellow-500 text-white rounded text-xs" onClick={()=>toggleSurvey(target.id)}>수동 완료</button>}</div>
                    <div className={getAttCount(target.id)>=minSessions?'text-green-600':'text-red-600 font-bold'}>{getAttCount(target.id)>=minSessions?'✅':'❌'} 출석 {getAttCount(target.id)}/{totalSessions} (최소 {minSessions})</div>
                  </div>
                </div>
                <div className="mb-4">
                  <h4 className="text-sm font-semibold mb-2">💳 카드 반납 (카드 QR 스캔)</h4>
                  <input ref={cardRef} type="text" className="scanner-input w-full px-4 py-3 border rounded-lg" value={cardQr} onChange={e=>setCardQr(e.target.value.trim())} onKeyDown={e=>{if(e.key==='Enter')processCompletion()}} placeholder="출입카드 QR 스캔 (반납)..."/>
                </div>
                <button className="w-full px-6 py-4 bg-green-600 text-white text-lg rounded-xl font-bold hover:bg-green-700 disabled:opacity-50 flex items-center justify-center gap-2" onClick={processCompletion} disabled={processing}>
                  {processing?<><Spinner/> 처리 중...</>:'🎓 수료 처리'}
                </button>
              </div>
            )
          ):(
            !target?(
              <div>
                <h3 className="text-sm font-semibold text-gray-500 mb-3">🚪 중도퇴장 — QR 스캔</h3>
                <div className="bg-orange-50 border border-orange-300 rounded-lg p-3 mb-3 text-sm">⚠️ 중도퇴장자는 <strong>미수료</strong> 처리됩니다.</div>
                <input ref={inputRef} type="text" className="scanner-input w-full px-4 py-3 border rounded-lg" value={qrInput} onChange={e=>setQr(e.target.value.trim())} onKeyDown={e=>{if(e.key==='Enter'&&qrInput)resolveTarget(qrInput)}} placeholder="QR 스캔..." autoFocus/>
                <button className="mt-3 px-3 py-1 border rounded text-xs" onClick={()=>setShowManual(true)}>🔍 수동 검색</button>
              </div>
            ):(
              <div>
                <div className="bg-gray-50 p-4 rounded-xl mb-4">
                  <div className="flex justify-between"><div><div className="text-xl font-bold">{target.name}</div><div className="text-sm text-gray-500">{target.company}</div></div>
                    <button className="px-3 py-1 border rounded text-xs" onClick={reset}>✕</button></div>
                </div>
                <div className="mb-3"><label className="text-sm font-semibold block mb-1">퇴장 사유</label>
                  <select className="w-full px-3 py-2 border rounded-lg" value={exitReason} onChange={e=>setExitReason(e.target.value)}>
                    {['개인사정','업무','건강','기타'].map(r=><option key={r}>{r}</option>)}
                  </select></div>
                <div className="mb-4"><label className="text-sm font-semibold block mb-1">메모</label>
                  <textarea className="w-full px-3 py-2 border rounded-lg" value={exitMemo} onChange={e=>setExitMemo(e.target.value)} rows={2}/></div>
                <button className="w-full px-6 py-4 bg-red-600 text-white text-lg rounded-xl font-bold hover:bg-red-700 disabled:opacity-50" onClick={processEarlyExit} disabled={processing}>
                  {processing?'처리 중...':'🚪 중도퇴장 처리'}
                </button>
              </div>
            )
          )}
        </div>
        <div className="bg-white rounded-xl p-5 shadow-sm">
          <h3 className="text-sm font-semibold text-gray-500 mb-3">참가자 현황</h3>
          <div className="max-h-96 overflow-y-auto">
            <table className="w-full text-sm"><thead><tr className="text-xs text-gray-500 bg-gray-50"><th className="text-left p-2">이름</th><th className="p-2">설문</th><th className="p-2">수료</th><th className="p-2">수료증</th></tr></thead>
              <tbody>{participants.map(p=>(
                <tr key={p.id} className="border-t"><td className="p-2 font-semibold">{p.name}<br/><span className="text-xs text-gray-400">{p.company}</span></td>
                  <td className="p-2 text-center">{p.surveyCompleted?<span className="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded-full">완료</span>:<span className="text-xs bg-gray-100 px-2 py-0.5 rounded-full cursor-pointer" onClick={()=>toggleSurvey(p.id)}>미완료</span>}</td>
                  <td className="p-2 text-center">{p.certificateIssued?<span className="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">수료</span>:<span className="text-xs bg-gray-100 px-2 py-0.5 rounded-full">대기</span>}</td>
                  <td className="p-2 text-center">{p.certificateIssued&&<button className="text-xs bg-green-600 text-white px-2 py-1 rounded hover:bg-green-700" onClick={()=>generateCertificate(p)}>📄 PDF</button>}</td></tr>
              ))}</tbody>
            </table>
          </div>
        </div>
      </div>
      {showManual&&<ManualSearch participants={participants} title={tab==='completion'?'수료 대상자':'중도퇴장 대상자'} onClose={()=>setShowManual(false)} onSelect={p=>{setTarget(p);setShowManual(false)}}/>}
    </div>
  );
}

/* ═══════════════════════════════════════════
   Records
   ═══════════════════════════════════════════ */
function RecordsPage({training,participants,attendanceRecords,cards,showToast,loadAttendance,loadParticipants}){
  const [search,setSearch]=useState('');
  const filtered=participants.filter(p=>p.name.includes(search)||p.company.includes(search)||(p.phone||'').includes(search));
  const dayArr=Array.from({length:training.days},(_,i)=>i+1);
  const totalSessions=training.days*2;

  // Load all attendance on mount
  useEffect(()=>{loadAttendance(training.id)},[]);

  const downloadExcel=()=>{
    const rows=filtered.map(p=>{
      const row={'이름':p.name,'회사':p.company,'직급':p.position||'','연락처':p.phone||''};
      dayArr.forEach(d=>{
        const am=attendanceRecords.find(a=>a.participantId===p.id&&a.day===d&&a.session==='AM');
        const pm=attendanceRecords.find(a=>a.participantId===p.id&&a.day===d&&a.session==='PM');
        row[`${d}일차 오전`]=am?new Date(am.checkedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
        row[`${d}일차 오후`]=pm?new Date(pm.checkedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
      });
      const attCount=attendanceRecords.filter(a=>a.participantId===p.id).length;
      row['출석률']=`${totalSessions?Math.round(attCount/totalSessions*100):0}%`;
      const pCard=cards.find(c=>c.participantId===p.id&&c.status!=='available');
      row['카드']=pCard?pCard.status==='returned'?'반납':pCard.status==='lost'?'분실':'보유':'';
      row['카드번호']=pCard?.qrCode||'';
      row['설문']=p.surveyCompleted?'완료':'미완료';
      row['수료']=p.certificateIssued?'발급':'미발급';
      return row;
    });
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'출석부');
    XLSX.writeFile(wb,`출석부_${training.name}_${new Date().toISOString().slice(0,10)}.xlsx`);
    showToast('📥 엑셀 다운로드 완료');
  };

  const downloadSmsExcel=()=>{
    const QR_BASE='https://edukosdaq-web.github.io/qr-attendance/qr.html?token=';
    const rows=participants.map(p=>({
      '성명':p.name,
      '이메일':p.email||'',
      '휴대폰':(p.phone||'').replace(/-/g,''),
      'FAX번호':'',
      '회사명':p.company||'',
      'QR링크':QR_BASE+encodeURIComponent(p.qrCode)
    }));
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'수신자');
    XLSX.writeFile(wb,`문자발송_${training.name}_${new Date().toISOString().slice(0,10)}.xlsx`);
    showToast('📱 문자 발송용 엑셀 다운로드 완료');
  };

  return(
    <div>
      <h1 className="text-2xl font-bold mb-5">📋 출석부 조회 — {training.name}</h1>
      <div className="bg-white rounded-xl p-4 mb-4 shadow-sm flex flex-wrap gap-3 items-center">
        <input type="search" className="flex-1 min-w-48 px-4 py-2 border rounded-lg" placeholder="🔍 이름, 소속사 검색..." value={search} onChange={e=>setSearch(e.target.value)}/>
        <button className="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-semibold" onClick={downloadExcel}>📥 엑셀 다운로드</button>
        <button className="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm font-semibold" onClick={downloadSmsExcel}>📱 문자 발송용 엑셀</button>
        <button className="px-4 py-2 border rounded-lg text-sm font-semibold hover:bg-gray-50" onClick={()=>Promise.all([loadAttendance(training.id),loadParticipants(training.id)]).then(()=>showToast('🔄 새로고침'))}>🔄</button>
      </div>
      <div className="bg-white rounded-xl shadow-sm overflow-x-auto">
        <table className="w-full text-sm"><thead><tr className="text-xs text-gray-500 uppercase bg-gray-50">
          <th className="text-left p-2">#</th><th className="text-left p-2">이름</th><th className="text-left p-2">소속</th>
          {dayArr.map(d=>[<th key={`${d}a`} className="p-2">{d}일 오전</th>,<th key={`${d}p`} className="p-2">{d}일 오후</th>])}
          <th className="p-2">출석률</th><th className="p-2">카드</th><th className="p-2">설문</th><th className="p-2">수료</th>
        </tr></thead>
          <tbody>{filtered.map((p,i)=>{
            const attCount=attendanceRecords.filter(a=>a.participantId===p.id).length;
            const rate=totalSessions?Math.round(attCount/totalSessions*100):0;
            const pCard=cards.find(c=>c.participantId===p.id&&c.status!=='available');
            return(
              <tr key={p.id} className="border-t hover:bg-gray-50">
                <td className="p-2">{i+1}</td><td className="p-2 font-semibold">{p.name}</td><td className="p-2 text-xs text-gray-500">{p.company}</td>
                {dayArr.map(d=>{
                  const am=attendanceRecords.find(a=>a.participantId===p.id&&a.day===d&&a.session==='AM');
                  const pm=attendanceRecords.find(a=>a.participantId===p.id&&a.day===d&&a.session==='PM');
                  return[
                    <td key={`${d}A`} className="p-2 text-center"><span className={`inline-flex items-center justify-center w-7 h-7 rounded-full text-xs font-bold ${am?'bg-green-100 text-green-800':'bg-gray-100 text-gray-300'}`}>{am?'✓':'·'}</span></td>,
                    <td key={`${d}P`} className="p-2 text-center"><span className={`inline-flex items-center justify-center w-7 h-7 rounded-full text-xs font-bold ${pm?'bg-green-100 text-green-800':'bg-gray-100 text-gray-300'}`}>{pm?'✓':'·'}</span></td>,
                  ];
                })}
                <td className="p-2 text-center"><span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${rate>=80?'bg-green-100 text-green-800':rate>=50?'bg-yellow-100 text-yellow-800':'bg-red-100 text-red-800'}`}>{rate}%</span></td>
                <td className="p-2 text-center">{pCard?(<div><span className={`text-xs px-2 py-0.5 rounded-full ${pCard.status==='returned'?'bg-green-100 text-green-800':pCard.status==='lost'?'bg-red-100 text-red-800':'bg-yellow-100 text-yellow-800'}`}>{pCard.status==='returned'?'반납':pCard.status==='lost'?'분실':'보유'}</span><div className="text-[10px] text-gray-400 mt-0.5">{pCard.qrCode?.replace('KOSDAQ-','')}</div></div>):'-'}</td>
                <td className="p-2 text-center">{p.surveyCompleted?<span className="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded-full">✓</span>:'-'}</td>
                <td className="p-2 text-center">{p.certificateIssued?<span className="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">발급</span>:'-'}</td>
              </tr>
            );
          })}</tbody>
        </table>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   Survey Manager
   ═══════════════════════════════════════════ */
function SurveyManager({training,participants,showToast}){
  const [tab,setTab]=useState('config');
  const [subjects,setSubjects]=useState([]); // [{name:'과목명',instructor:'강사명'}]
  const [showFixed,setShowFixed]=useState(false);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [results,setResults]=useState(null);
  const [loadingResults,setLoadingResults]=useState(false);
  const [newSubName,setNewSubName]=useState('');
  const [newSubInst,setNewSubInst]=useState('');

  useEffect(()=>{
    (async()=>{
      setLoading(true);
      try{
        const res=await apiGet('getSurveyConfig',{tid:training.id});
        if(res.status==='ok'&&res.data&&res.data.subjects){
          setSubjects(res.data.subjects);
        }
      }catch(e){}
      finally{setLoading(false)}
    })();
  },[training.id]);

  const addSubject=()=>{
    if(!newSubName.trim()||!newSubInst.trim()){showToast('❌ 과목명과 강사명을 모두 입력하세요','err');return}
    setSubjects(prev=>[...prev,{name:newSubName.trim(),instructor:newSubInst.trim()}]);
    setNewSubName('');setNewSubInst('');
  };

  const removeSubject=(idx)=>{setSubjects(prev=>prev.filter((_,i)=>i!==idx))};

  const moveSubject=(idx,dir)=>{
    const arr=[...subjects];
    const target=idx+dir;
    if(target<0||target>=arr.length)return;
    [arr[idx],arr[target]]=[arr[target],arr[idx]];
    setSubjects(arr);
  };

  const saveConfig=async()=>{
    setSaving(true);
    try{
      const res=await apiPost({action:'saveSurveyConfig',tid:training.id,subjects});
      if(res.status==='ok') showToast('✅ 설문 설정 저장 완료');
      else showToast('❌ '+(res.message||'저장 실패'),'err');
    }catch(e){showToast('❌ 저장 실패','err')}
    finally{setSaving(false)}
  };

  const loadResults=async()=>{
    setLoadingResults(true);
    try{
      const res=await apiGet('getSurveyResults',{tid:training.id});
      if(res.status==='ok') setResults(res.data);
      else showToast('❌ '+(res.message||'결과 로딩 실패'),'err');
    }catch(e){showToast('❌ 결과 로딩 실패','err')}
    finally{setLoadingResults(false)}
  };

  useEffect(()=>{if(tab==='results')loadResults()},[tab]);

  const downloadResultsExcel=()=>{
    if(!results||!results.responses||!results.responses.length){showToast('❌ 다운로드할 데이터가 없습니다','err');return}
    const rows=results.responses.map(r=>{
      const a=r.answers||{};
      const row={'이름':r.name,'제출시각':r.submittedAt,'Q1_근무기간':a.q1||'','Q2_업무능력':a.q2||'','Q3_기대사항':a.q3||'','Q3_기타':a.q3_text||'','Q4_만족도':a.q4||'','Q5_만족이유':a.q5||'','Q6_불만족이유':a.q6||''};
      (a.subjects||[]).forEach(s=>{row[s.name+' - '+s.instructor]=s.score});
      row['주관식_과목의견']=a.text1||'';
      row['주관식_개선점']=a.text2||'';
      return row;
    });
    const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'설문결과');
    XLSX.writeFile(wb,`설문결과_${training.name}_${new Date().toISOString().slice(0,10)}.xlsx`);
    showToast('📥 설문 결과 엑셀 다운로드 완료');
  };

  const FIXED_QUESTIONS=[
    {num:'Q1',text:'공시담당자로 근무하신지 얼마나 되셨습니까?',type:'객관식 (5개 선택지)'},
    {num:'Q2',text:'본 교육 수강 전, 공시 관련 본인의 업무 수행 능력은?',type:'5점 척도'},
    {num:'Q3',text:'본 교육에서 가장 기대했던 것은 무엇입니까?',type:'객관식 (5개+기타)'},
    {num:'Q4',text:'교육에 얼마나 만족하십니까?',type:'객관식 (4개)'},
    {num:'Q5',text:'만족 시 → 어떤 점이 만족스러우셨습니까?',type:'객관식 (5개, 분기)'},
    {num:'Q6',text:'불만족 시 → 어떤 점의 개선이 필요하십니까?',type:'객관식 (5개, 분기)'},
    {num:'—',text:'인상적/개선 필요 과목 의견',type:'주관식 (1000자)'},
    {num:'—',text:'본회에 요청/개선할 점',type:'주관식 (1000자, 필수)'},
  ];

  if(loading)return <div className="flex items-center gap-2"><Spinner/> 설문 설정 로딩 중...</div>;

  return(
    <div>
      <h1 className="text-2xl font-bold mb-5">📝 설문 관리</h1>
      <div className="flex gap-2 mb-4 border-b pb-2">
        <button className={`px-4 py-2 font-semibold text-sm rounded-t ${tab==='config'?'bg-blue-600 text-white':'border'}`} onClick={()=>setTab('config')}>⚙️ 설문 설정</button>
        <button className={`px-4 py-2 font-semibold text-sm rounded-t ${tab==='results'?'bg-blue-600 text-white':'border'}`} onClick={()=>setTab('results')}>📊 결과 보기</button>
      </div>

      {tab==='config'?(
        <div>
          <div className="bg-blue-50 border border-blue-300 rounded-xl p-3 mb-4 text-sm">
            💡 고정 문항(근무기간, 업무능력, 기대사항, 만족도, 주관식)은 <strong>자동 포함</strong>됩니다. 아래에서 <strong>과목별 강사 평가</strong>만 설정하세요.
          </div>

          {/* 고정 문항 접기/펼치기 */}
          <div className="bg-white rounded-xl shadow-sm mb-4">
            <div className="flex justify-between items-center p-4 cursor-pointer hover:bg-gray-50 rounded-xl" onClick={()=>setShowFixed(!showFixed)}>
              <h3 className="text-sm font-bold text-gray-600">📋 고정 문항 (자동 포함) {showFixed?'▼':'▶'}</h3>
              <span className="text-xs text-gray-400">{showFixed?'접기':'펼쳐서 확인'}</span>
            </div>
            {showFixed&&<div className="px-4 pb-4">
              <table className="w-full text-sm"><thead><tr className="text-xs text-gray-500 bg-gray-50"><th className="text-left p-2 w-12">#</th><th className="text-left p-2">문항</th><th className="text-left p-2 w-32">유형</th></tr></thead>
                <tbody>{FIXED_QUESTIONS.map((q,i)=>(
                  <tr key={i} className="border-t"><td className="p-2 text-xs text-gray-400">{q.num}</td><td className="p-2">{q.text}</td><td className="p-2 text-xs text-gray-500">{q.type}</td></tr>
                ))}</tbody>
              </table>
              <div className="mt-3 text-xs text-gray-400">※ 고정 문항 내용 수정이 필요하면 survey.html 파일을 직접 수정하세요.</div>
            </div>}
          </div>

          {/* 과목별 강사 평가 설정 */}
          <div className="bg-white rounded-xl p-5 shadow-sm mb-4">
            <h3 className="text-base font-bold mb-4">👨‍🏫 과목별 강사 평가 (5점 척도)</h3>
            {subjects.length===0&&<div className="text-center text-gray-400 py-6 mb-4">등록된 과목이 없습니다. 아래에서 추가하세요.</div>}
            {subjects.map((s,i)=>(
              <div key={i} className="flex gap-2 items-center mb-3 p-3 bg-gray-50 rounded-lg">
                <span className="text-xs text-gray-400 w-6">{i+1}</span>
                <div className="flex-1">
                  <span className="font-semibold text-sm">{s.name}</span>
                  <span className="text-gray-400 text-sm"> — {s.instructor}</span>
                </div>
                <div className="flex gap-1">
                  <button className="px-2 py-1 text-xs border rounded hover:bg-gray-100" onClick={()=>moveSubject(i,-1)} disabled={i===0}>▲</button>
                  <button className="px-2 py-1 text-xs border rounded hover:bg-gray-100" onClick={()=>moveSubject(i,1)} disabled={i===subjects.length-1}>▼</button>
                  <button className="px-2 py-1 text-red-500 hover:bg-red-50 rounded text-sm" onClick={()=>removeSubject(i)}>🗑️</button>
                </div>
              </div>
            ))}
            <div className="flex gap-2 items-end mt-4 p-3 bg-blue-50 rounded-lg">
              <div className="flex-1"><label className="text-xs font-semibold block mb-1">과목명</label><input type="text" className="w-full px-3 py-2 border rounded-lg text-sm" value={newSubName} onChange={e=>setNewSubName(e.target.value)} placeholder="예: XBRL 텍사노미의 이해" onKeyDown={e=>{if(e.key==='Enter')document.getElementById('instInput')?.focus()}}/></div>
              <div className="flex-1"><label className="text-xs font-semibold block mb-1">강사명</label><input id="instInput" type="text" className="w-full px-3 py-2 border rounded-lg text-sm" value={newSubInst} onChange={e=>setNewSubInst(e.target.value)} placeholder="예: 금융감독원 김민성 조사역" onKeyDown={e=>{if(e.key==='Enter')addSubject()}}/></div>
              <button className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold whitespace-nowrap" onClick={addSubject}>+ 추가</button>
            </div>
          </div>

          <div className="flex gap-3 justify-end">
            <button className="px-6 py-3 bg-green-600 text-white rounded-xl font-bold text-sm flex items-center gap-2" onClick={saveConfig} disabled={saving}>
              {saving?<><Spinner/> 저장 중...</>:'💾 설문 설정 저장'}
            </button>
          </div>
        </div>
      ):(
        <div>
          {loadingResults?<div className="flex items-center gap-2"><Spinner/> 결과 로딩 중...</div>:!results||!results.totalResponses?(
            <div className="bg-white rounded-xl p-12 text-center text-gray-400">
              <div className="text-5xl mb-3">📊</div>
              <p>아직 설문 응답이 없습니다.</p>
            </div>
          ):(
            <div>
              <div className="flex justify-between items-center mb-4">
                <div className="font-semibold">총 응답: {results.totalResponses}명 / {participants.length}명</div>
                <div className="flex gap-2">
                  <button className="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-semibold" onClick={downloadResultsExcel}>📥 엑셀 다운로드</button>
                  <button className="px-4 py-2 border rounded-lg text-sm font-semibold hover:bg-gray-50" onClick={loadResults}>🔄</button>
                </div>
              </div>
              {/* 고정 문항 통계 */}
              {results.fixedStats&&<div className="bg-white rounded-xl p-5 shadow-sm mb-4">
                <h3 className="text-sm font-semibold text-gray-500 mb-3">📋 고정 문항 통계</h3>
                {['q1','q2','q3','q4','q5','q6'].map(k=>{
                  const s=results.fixedStats[k];if(!s||!s.total)return null;
                  return <div key={k} className="mb-4 pb-3 border-b last:border-0">
                    <div className="font-semibold text-sm mb-2">{s.label}</div>
                    {s.type==='choice'&&<div className="space-y-1">{Object.entries(s.dist||{}).map(([opt,cnt])=>(
                      <div key={opt} className="flex items-center gap-2 text-sm"><span className="w-48 truncate">{opt}</span><div className="flex-1 h-4 bg-gray-100 rounded"><div className="h-full bg-blue-500 rounded" style={{width:Math.round(cnt/s.total*100)+'%'}}/></div><span className="w-12 text-right text-xs text-gray-500">{cnt}명 ({Math.round(cnt/s.total*100)}%)</span></div>
                    ))}</div>}
                    {s.type==='scale'&&<div className="text-sm">평균: <strong className={s.avg>=4?'text-green-600':s.avg>=3?'text-yellow-600':'text-red-600'}>{s.avg}점</strong> (응답 {s.total}명)</div>}
                  </div>;
                })}
              </div>}
              {/* 과목별 통계 */}
              {results.subjectStats&&results.subjectStats.length>0&&<div className="bg-white rounded-xl p-5 shadow-sm mb-4">
                <h3 className="text-sm font-semibold text-gray-500 mb-3">👨‍🏫 과목별 강사 평가</h3>
                <table className="w-full text-sm"><thead><tr className="text-xs text-gray-500 bg-gray-50"><th className="text-left p-2">과목</th><th className="text-left p-2">강사</th><th className="p-2">응답</th><th className="p-2">평균</th></tr></thead>
                  <tbody>{results.subjectStats.map((s,i)=>(
                    <tr key={i} className="border-t"><td className="p-2">{s.name}</td><td className="p-2 text-gray-500">{s.instructor}</td><td className="p-2 text-center">{s.count}</td><td className="p-2 text-center font-bold"><span className={s.avg>=4?'text-green-600':s.avg>=3?'text-yellow-600':'text-red-600'}>{s.avg}</span></td></tr>
                  ))}</tbody>
                </table>
              </div>}
              {/* 주관식 */}
              {results.textResponses&&Object.entries(results.textResponses).map(([key,texts])=>(
                texts&&texts.length>0&&<div key={key} className="bg-white rounded-xl p-5 shadow-sm mb-4">
                  <h4 className="font-semibold mb-3">💬 {key==='text1'?'인상적/개선 필요 과목 의견':'본회 요청/개선점'} ({texts.length}건)</h4>
                  <div className="space-y-2 max-h-60 overflow-y-auto">{texts.map((t,i)=><div key={i} className="bg-gray-50 p-3 rounded-lg text-sm">{t}</div>)}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
