<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코스닥협회 QR 출석 시스템 v5</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Pretendard,SUIT,"Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;letter-spacing:-0.015em;color:#0f172a;background:#f8fafc}
/* v5.4 Figma Make 톤 — 글로벌 컬러 override (기존 blue → coral) */
.bg-blue-600,.from-blue-700,.to-purple-800{background:#f04e23!important;background-image:none!important}
.bg-gradient-to-br.from-blue-700.to-purple-800{background-image:linear-gradient(135deg,#f04e23,#f58220)!important}
.hover\:bg-blue-700:hover{background:#d33d18!important}
.text-blue-600,.text-blue-500,.text-blue-400{color:#f04e23!important}
.text-blue-700,.text-blue-800{color:#c43e1a!important}
.bg-blue-100,.bg-blue-50{background:#fff0ed!important}
.border-blue-500,.border-blue-600,.border-blue-400{border-color:#f04e23!important}
.bg-gray-900,.bg-gray-800{background:#0f172a!important}
.text-gray-500,.text-gray-400{color:#64748b!important}
.scanner-input{border:2px solid #f04e23!important;background:#fff0ed;font-size:18px!important;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.scanner-input:focus{border-color:#f58220!important;box-shadow:0 0 0 4px rgba(240,78,35,.15)!important}
.scan-flash{position:fixed;inset:0;z-index:400;pointer-events:none;animation:flashAnim .5s ease-out forwards}
@keyframes flashAnim{0%{opacity:.4}100%{opacity:0}}
.scan-result-big{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:300;padding:40px 56px;border-radius:24px;text-align:center;min-width:380px;animation:popIn .2s ease-out}
@keyframes popIn{from{transform:translate(-50%,-50%) scale(.8);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.scan-result-big.success{background:#dcfce7;border:4px solid #22c55e;color:#166534}
.scan-result-big.error{background:#fee2e2;border:4px solid #ef4444;color:#991b1b}
.scan-result-big.duplicate{background:#fef9c3;border:4px solid #eab308;color:#854d0e}
@media print{.no-print{display:none!important}}
@media(max-width:768px){.sidebar-wrap{display:none!important}.mobile-nav{display:flex!important}}
.mobile-nav{display:none}
.loading-spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(0,0,0,.1);border-radius:50%;border-top-color:#f04e23;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:500}
</style>

<body class="bg-gray-50 text-gray-900">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

/* ═══════════════════════════════════════════
   API Configuration
   ═══════════════════════════════════════════ */
const API_URL='https://script.google.com/macros/s/AKfycbz5sEyjgPzbzSGEQl9q3tI2_wJv5zX5YuAYkXpLM8ThsF3yJS6FaksEVl0CCl7R3dFP/exec';
const DEV_MODE=false; // true이면 시뮬레이션 버튼 표시

/* ─── API Helper (인증키 포함) ─── */
let AUTH_KEY=sessionStorage.getItem('kosdaq_v5_authkey')||'';
function setAuthKey(key){AUTH_KEY=key;sessionStorage.setItem('kosdaq_v5_authkey',key)}

// v5.4: 「verify」 액션은 인증 검증용이므로 AUTH_KEY 없어도 호출 가능
// 그 외 액션은 AUTH_KEY 가드 — 빈 키로 서버 호출 차단 후 401 응답 강제
const PUBLIC_ACTIONS=new Set(['verify','checkQRAccess','markSurvey']);
function _requireAuth(action){
  if(PUBLIC_ACTIONS.has(action)) return true;
  if(!AUTH_KEY){
    console.warn('[auth] AUTH_KEY 없음 — '+action+' 호출 차단');
    return false;
  }
  return true;
}

async function apiGet(action,params={}){
  if(!_requireAuth(action)){return{status:'err',code:'NO_AUTH',message:'인증키가 없습니다 — 다시 로그인해주세요'};}
  const qs=new URLSearchParams({action,authKey:AUTH_KEY,...params}).toString();
  const url=`${API_URL}?${qs}`;
  try{
    const res=await fetch(url,{redirect:'follow'});
    const json=await res.json();
    return json;
  }catch(e){
    console.error('API GET error:',action,e);
    throw e;
  }
}

async function apiPost(body){
  if(!_requireAuth(body.action)){return{status:'err',code:'NO_AUTH',message:'인증키가 없습니다 — 다시 로그인해주세요'};}
  // 배열/객체 포함 액션은 POST, 나머지는 GET (Safari POST→302 문제 우회)
  const needsPost=['uploadParticipants','saveSurveyConfig','submitSurvey'];
  if(needsPost.includes(body.action)){
    try{
      const res=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...body,authKey:AUTH_KEY})});
      return await res.json();
    }catch(e){console.error('API POST error:',body.action,e);throw e}
  }
  const qs=new URLSearchParams({...body,authKey:AUTH_KEY}).toString();
  try{
    const res=await fetch(API_URL+'?'+qs,{redirect:'follow'});
    return await res.json();
  }catch(e){
    console.error('API GET error:',body.action,e);
    throw e;
  }
}

/* ─── LocalStorage Cache ─── */
const CACHE_KEY='kosdaq_qr_v5_cache';
function cacheGet(key){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}');return c[key]}catch(e){return null}}
function cacheSet(key,val){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}');c[key]=val;c[key+'_ts']=Date.now();localStorage.setItem(CACHE_KEY,JSON.stringify(c))}catch(e){}}

/* ─── Audio ─── */
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
// v5.4: iOS Safari/모바일 브라우저 첫 스캔 무음 방지
// 사용자 제스처 전 생성된 AudioContext는 suspended 상태이므로,
// 첫 사용자 입력(키·터치·마우스) 발생 시 resume()을 1회 시도.
function ensureAudioCtx(){
  try{
    if(!audioCtx)audioCtx=new AudioCtx();
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  }catch(e){}
}
['pointerdown','keydown','touchstart'].forEach(ev=>{
  window.addEventListener(ev,ensureAudioCtx,{once:false,passive:true});
});
function playBeep(type){
  try{
    ensureAudioCtx();
    if(!audioCtx)return;
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);gain.gain.value=0.3;
    if(type==='success'){osc.frequency.value=880;osc.type='sine'}
    else if(type==='error'){osc.frequency.value=220;osc.type='square'}
    else{osc.frequency.value=440;osc.type='triangle'}
    osc.start();osc.stop(audioCtx.currentTime+(type==='error'?0.3:0.15));
  }catch(e){}
}

/* ─── UUID ─── */
function uuid(){return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)})}

/* ─── Focus Lock ─── */
function useFocusLock(ref,active=true){
  useEffect(()=>{
    if(!active)return;
    const el=ref.current;if(!el)return;
    el.focus();
    const t=setInterval(()=>{if(document.activeElement!==el)el.focus()},500);
    return()=>clearInterval(t);
  },[active]);
}

/* ─── Loading Component ─── */
function Spinner({size='sm'}){
  const s=size==='lg'?'w-8 h-8 border-4':'w-5 h-5 border-3';
  return <span className={`loading-spinner ${s}`}/>;
}
function LoadingOverlay({text}){
  return <div className="loading-overlay"><div className="text-center"><Spinner size="lg"/><div className="mt-3 text-gray-600 font-semibold">{text||'로딩 중...'}</div></div></div>;
}

/* ─── Field Mapping: API 한글 → 프론트 영문 ─── */
function parseDate(v){if(!v)return'';const d=new Date(v);if(isNaN(d))return v;return d.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\.\s?/g,'-').replace(/-$/,'')}
function mapTraining(t){
  const today=new Date();today.setHours(0,0,0,0);
  const rawStart=t.시작일||t.startDate||'';
  const rawEnd=t.종료일||t.endDate||'';
  const sd=rawStart?new Date(rawStart):null;
  const ed=rawEnd?new Date(rawEnd):null;
  let status=t.상태||t.status||'preparing';
  // 상태 자동 판정: 준비중/active/upcoming 등 서버값 무시하고 날짜 기준
  if(sd&&ed){if(today>ed)status='completed';else if(today>=sd)status='active';else status='preparing';}
  else if(status==='준비중')status='preparing';
  return{
    id:t.연수id||t.id,
    name:t.연수명||t.name||'',
    startDate:parseDate(rawStart),
    endDate:parseDate(rawEnd),
    days:Number(t.일수||t.days||1),
    status,
    surveyUrl:t.설문URL||'',
    participantCount:Number(t.참가자수||0),
  };
}
function mapParticipant(p,tid){
  return{
    id:p.참가자id||p.id||uuid(),
    trainingId:tid||p.연수id||p.trainingId,
    name:p.이름||p.name||'',
    company:p.회사||p.소속사||p.company||'',
    position:p.직급||p.position||'',
    phone:p.연락처||p.phone||'',
    email:p.이메일||p.email||'',
    manager:p.담당자||p.manager||'',
    qrCode:p.QR코드||p.qrCode||'',
    surveyCompleted:p.설문완료==='Y'||p.설문완료===true||p.surveyCompleted||false,
    certificateIssued:p.수료여부==='Y'||p.수료여부===true||p.certificateIssued||false,
  };
}
function mapCard(c){
  return{
    id:c.카드id||c.id||uuid(),
    qrCode:c.QR코드||c.카드QR||c.qrCode||'',
    status:c.상태||c.status||'available',
    participantId:c.참가자id||c.participantId||null,
    participantName:c.참가자이름||c.participantName||'',
    mappedAt:c.매핑일시||c.mappedAt||null,
    returnedAt:c.반납일시||c.returnedAt||null,
  };
}
function mapAttendance(a){
  return{
    id:a.출석id||a.id||uuid(),
    participantId:a.참가자id||a.participantId,
    trainingId:a.연수id||a.trainingId,
    day:Number(a.일차||a.day),
    session:a.세션||a.시간대||a.session,
    checkedAt:a.체크시각||a.출석시각||a.checkedAt,
    method:a.방법||a.method||'scanner',
    late:a.지각여부==='Y'||a.late||false,
  };
}

/* ═══════════════════════════════════════════
   App
   ═══════════════════════════════════════════ */
function App(){
  const [loggedIn,setLoggedIn]=useState(!!sessionStorage.getItem('kosdaq_v5_auth'));
  const [page,setPage]=useState('dashboard');
  const [selTraining,setSelTraining]=useState(null);
  const [toast,setToast]=useState(null);
  const [scanResult,setScanResult]=useState(null);
  const [flash,setFlash]=useState(null);
  const [globalLoading,setGlobalLoading]=useState(false);

  // Data state
  const [trainings,setTrainings]=useState([]);
  const [participants,setParticipants]=useState([]);
  const [cards,setCards]=useState([]);
  const [attendance,setAttendance]=useState([]);

  const showToast=useCallback((msg,type='ok')=>{setToast({msg,type});setTimeout(()=>setToast(null),2000)},[]);
  const showScanResult=useCallback((type,icon,name,detail,duration,btn)=>{
    setScanResult({type,icon,name,detail,btn});playBeep(type);
    setFlash(type);setTimeout(()=>setFlash(null),500);
    if(!btn){setTimeout(()=>setScanResult(null),duration||2500)}
  },[]);

  /* ─── Data Loading ─── */
  const loadTrainings=useCallback(async()=>{
    try{
      const res=await apiGet('getTrainings');
      const list=(res.data||res||[]).map(mapTraining);
      setTrainings(list);
      cacheSet('trainings',list);
      return list;
    }catch(e){
      const cached=cacheGet('trainings');
      if(cached){setTrainings(cached);showToast('⚠️ 오프라인 모드 (캐시)','warn')}
      else showToast('❌ 연수 목록 로딩 실패','err');
      return cached||[];
    }
  },[showToast]);

  const loadParticipants=useCallback(async(tid)=>{
    // 캐시 우선 표시
    const cached=cacheGet(`participants_${tid}`);
    if(cached){setParticipants(prev=>[...prev.filter(p=>p.trainingId!==tid),...cached])}
    try{
      const res=await apiGet('getParticipants',{tid});
      const list=(res.data||res||[]).map(p=>mapParticipant(p,tid));
      setParticipants(prev=>{
        const other=prev.filter(p=>p.trainingId!==tid);
        return[...other,...list];
      });
      cacheSet(`participants_${tid}`,list);
      return list;
    }catch(e){
      return cached||[];
    }
  },[]);

  const loadCards=useCallback(async()=>{
    const cached=cacheGet('cards');
    if(cached)setCards(cached);
    try{
      const res=await apiGet('getCards');
      const list=(res.data||res||[]).map(mapCard);
      setCards(list);
      cacheSet('cards',list);
      return list;
    }catch(e){
      return cached||[];
    }
  },[]);

  const loadAttendance=useCallback(async(tid,day)=>{
    const ck=`attendance_${tid}${day?'_'+day:''}`;
    const cached=cacheGet(ck);
    if(cached){
      if(day){setAttendance(prev=>[...prev.filter(a=>!(a.trainingId===tid&&a.day===Number(day))),...cached])}
      else{setAttendance(prev=>[...prev.filter(a=>a.trainingId!==tid),...cached])}
    }
    try{
      const params={tid};
      if(day)params.day=String(day);
      const res=await apiGet('getAttendance',params);
      const list=(res.data||res||[]).map(mapAttendance);
      if(day){
        setAttendance(prev=>{
          const other=prev.filter(a=>!(a.trainingId===tid&&a.day===Number(day)));
          return[...other,...list];
        });
      }else{
        setAttendance(prev=>{
          const other=prev.filter(a=>a.trainingId!==tid);
          return[...other,...list];
        });
      }
      cacheSet(ck,list);
      return list;
    }catch(e){
      return cached||[];
    }
  },[]);

  const loadAllForTraining=useCallback(async(tid)=>{
    setGlobalLoading(true);
    try{
      await Promise.all([loadParticipants(tid),loadCards(),loadAttendance(tid)]);
    }finally{setGlobalLoading(false)}
  },[loadParticipants,loadCards,loadAttendance]);

  // Initial load
  useEffect(()=>{
    if(loggedIn)loadTrainings();
  },[loggedIn,loadTrainings]);

  const training=trainings.find(t=>t.id===selTraining);
  const curParticipants=useMemo(()=>participants.filter(p=>p.trainingId===selTraining),[participants,selTraining]);
  const curAttendance=useMemo(()=>attendance.filter(a=>a.trainingId===selTraining),[attendance,selTraining]);

  const selectTraining=async(id)=>{
    setSelTraining(id);
    setPage('training-dashboard');
    await loadAllForTraining(id);
  };
  const goBack=()=>{setSelTraining(null);setPage('dashboard')};

  if(!loggedIn)return <Login onLogin={()=>{sessionStorage.setItem('kosdaq_v5_auth','1');setLoggedIn(true)}}/>;

  // v5.4 Figma Make 톤: lucide-style 라인 아이콘 SVG path
  const IconSvg=({d,size=20})=>(
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
      <path d={d}/>
    </svg>
  );
  const ICONS={
    dashboard:'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
    upload:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM19 8v6M22 11h-6',
    attendance:'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
    completion:'M22 10v6M2 10l10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5',
    records:'M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v0zM12 11h4M12 16h4M8 11h.01M8 16h.01',
    survey:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8',
    back:'M19 12H5M12 19l-7-7 7-7',
    logout:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',
  };
  const nav=selTraining?[
    {id:'training-dashboard',icon:ICONS.dashboard,label:'대시보드'},
    {id:'upload',icon:ICONS.upload,label:'명단 업로드'},
    {id:'attendance',icon:ICONS.attendance,label:'출석 체크'},
    {id:'completion',icon:ICONS.completion,label:'수료 처리'},
    {id:'records',icon:ICONS.records,label:'출석부 조회'},
    {id:'survey',icon:ICONS.survey,label:'설문 관리'},
  ]:[];

  const getStats=(tid)=>{
    const ps=participants.filter(p=>p.trainingId===tid);
    const t=trainings.find(x=>x.id===tid);
    if(!ps.length||!t)return{total:0,mapped:0,mappingRate:0,attendanceRate:0,certRate:0,cardReturnRate:0,cert:0};
    const total=ps.length;
    const mapped=ps.filter(p=>cards.some(c=>c.participantId===p.id&&c.status!=='available')).length;
    const atts=attendance.filter(a=>a.trainingId===tid);
    const totalSessions=t.days*2;
    const attRate=totalSessions&&total?Math.round(atts.length/(total*totalSessions)*100):0;
    const cert=ps.filter(p=>p.certificateIssued).length;
    const returned=cards.filter(c=>ps.some(p=>p.id===c.participantId)&&c.returnedAt).length;
    return{total,mapped,mappingRate:total?Math.round(mapped/total*100):0,attendanceRate:attRate,certRate:total?Math.round(cert/total*100):0,cert,cardReturnRate:mapped?Math.round(returned/mapped*100):0};
  };

  const pg=()=>{
    if(!selTraining)return <Dashboard trainings={trainings} participants={participants} cards={cards} attendance={attendance} getStats={getStats} selectTraining={selectTraining} showToast={showToast} loadTrainings={loadTrainings}/>;
    if(!training)return <div className="p-8">연수를 찾을 수 없습니다</div>;
    const props={training,participants:curParticipants,cards,attendanceRecords:curAttendance,showToast,showScanResult,loadParticipants,loadCards,loadAttendance,loadAllForTraining,setParticipants,setCards,setAttendance};
    switch(page){
      case 'training-dashboard':return <TrainingDash {...props} getStats={getStats}/>;
      case 'upload':return <Upload {...props}/>;
      /* mapping 페이지 제거 — 출석 체크에서 자동 매핑 */
      case 'attendance':return <AttendancePage {...props}/>;
      case 'completion':return <CompletionPage {...props}/>;
      case 'records':return <RecordsPage {...props}/>;
      case 'survey':return <SurveyManager {...props}/>;
      default:return <TrainingDash {...props} getStats={getStats}/>;
    }
  };

  return(
    <div className="flex min-h-screen">
      {globalLoading&&<LoadingOverlay text="데이터 로딩 중..."/>}
      {flash&&<div className="scan-flash" style={{background:flash==='success'?'#22c55e':flash==='error'?'#ef4444':'#eab308'}}/>}
      <div className="sidebar-wrap" style={{width:240,background:'#fff',borderRight:'1px solid #f1f5f9',flexShrink:0,display:'flex',flexDirection:'column',minHeight:'100vh',fontFamily:'-apple-system,BlinkMacSystemFont,Pretendard,SUIT,"Noto Sans KR",sans-serif'}}>
        {/* 로고 영역 */}
        <div style={{padding:'24px 20px',borderBottom:'1px solid #f1f5f9'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:32,height:32,background:'#f04e23',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff'}}>

/* ═══════════════════════════════════════════
   Login — uses getConfig API
   ═══════════════════════════════════════════ */
function Login({onLogin}){
  const [pw,setPw]=useState('');
  const [err,setErr]=useState(false);
  const [loading,setLoading]=useState(false);

  const handleLogin=async()=>{
    setLoading(true);
    try{
      // 입력한 비밀번호를 authKey로 설정 후 API 호출로 검증
      setAuthKey(pw);
      const res=await apiGet('getTrainings');
      if(res.status==='ok'){onLogin()}
      else{setAuthKey('');setErr(true);setTimeout(()=>setErr(false),1500)}
    }catch(e){
      setAuthKey('');setErr(true);setTimeout(()=>setErr(false),1500)
    }finally{setLoading(false)}
  };

  return(
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-700 to-purple-800">
      <div className="bg-white rounded-2xl p-10 shadow-2xl w-full max-w-sm">
        <div className="text-center mb-8">
          <div className="text-4xl mb-2">🏢</div>
          <h1 className="text-xl font-bold">코스닥협회 QR 출석시스템</h1>
          <p className="text-sm text-gray-500 mt-1">v5.3 — 관리자 로그인</p>
        </div>
        <input type="password" className="w-full px-4 py-3 border rounded-lg text-lg mb-3" placeholder="비밀번호" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')handleLogin()}} autoFocus disabled={loading}/>
        {err&&<p className="text-red-600 text-sm mb-2 font-semibold">❌ 비밀번호가 틀렸습니다</p>}
        <button className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold flex items-center justify-center gap-2" onClick={handleLogin} disabled={loading}>
          {loading?<><Spinner/> 확인 중...</>:'로그인'}
        </button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   Dashboard
   ═══════════════════════════════════════════ */
function Dashboard({trainings,participants,cards,attendance,getStats,selectTraining,showToast,loadTrainings}){
  const [showCreate,setShowCreate]=useState(false);
  const [creating,setCreating]=useState(false);
  const [editTarget,setEditTarget]=useState(null);
  const [editing,setEditing]=useState(false);
  const globalTotal=participants.length;
  const globalCert=participants.filter(p=>p.certificateIssued).length;

  const createTraining=async(form)=>{
    setCreating(true);
    try{
      const res=await apiPost({
        action:'addTraining',
        연수명:form.name,
        시작일:form.startDate,
        종료일:form.endDate||form.startDate,
        일수:form.days,
        /* 시작시간/지각기준 제거 */
        /* 지각기준 제거 */
        설문URL:form.surveyUrl||'',
      });
      if(res.status==='ok'){
        showToast(`✅ "${form.name}" 연수 생성`);
        setShowCreate(false);
        await loadTrainings();
      }else{
        showToast(`❌ ${res.message||'생성 실패'}`,'err');
      }
    }catch(e){
      showToast('❌ 연수 생성 실패 (네트워크 오류)','err');
    }finally{setCreating(false)}
  };

  const updateTraining=async(form)=>{
    setEditing(true);
    try{
      const res=await apiPost({
        action:'updateTraining',
        id:form.id,
        연수명:form.name,
        시작일:form.startDate,
        종료일:form.endDate,
        일수:form.days,
        상태:form.status,
        오전시작:form.amStart||'09:00',
        오후시작:form.pmStart||'13:00',
        지각기준:form.lateMinutes||10,
      });
      if(res.status==='ok'){
        showToast(`✅ "${form.name}" 연수 수정 완료`);
        setEditTarget(null);
        await loadTrainings();
      }else{
        showToast(`❌ ${res.message||'수정 실패'}`,'err');
      }
    }catch(e){
      showToast('❌ 연수 수정 실패 (네트워크 오류)','err');
    }finally{setEditing(false)}
  };

  const deleteTraining=async(t)=>{
    if(!confirm(`'${t.name}' 연수를 삭제하시겠습니까?\n관련된 참가자, 출석, 카드 데이터가 모두 삭제됩니다.`))return;
    try{
      const res=await apiPost({action:'deleteTraining',id:t.id});
      if(res.status==='ok'){
        showToast(`🗑️ "${t.name}" 연수 삭제 완료`);
        await loadTrainings();
      }else{
        showToast(`❌ ${res.message||'삭제 실패'}`,'err');
      }
    }catch(e){
      showToast('❌ 연수 삭제 실패 (네트워크 오류)','err');
    }
  };

  const [searchQ,setSearchQ]=useState('');
  const [statusFilter,setStatusFilter]=useState('all');
  const activeTrainings=trainings.filter(t=>t.status==='active');
  const preparingList=trainings.filter(t=>t.status==='preparing');
  const filteredTrainings=trainings.filter(t=>{
    if(statusFilter!=='all'&&t.status!==statusFilter)return false;
    if(searchQ&&!t.name.includes(searchQ))return false;
    return true;
  });

  return(
    <div>
      <h1 className="text-2xl font-bold mb-5">연수 관리</h1>
      {/* 진행 중인 연수 빠른 진입 */}
      {activeTrainings.length>0&&<div className="mb-5">
        <h2 className="text-sm font-semibold text-gray-500 mb-2">🔴 진행 중</h2>
        <div className="grid md:grid-cols-2 gap-3">
          {activeTrainings.map(t=>{const s=getStats(t.id);return(
            <div key={t.id} className="bg-green-50 border-2 border-green-400 rounded-xl p-4 cursor-pointer hover:-translate-y-0.5 transition-all" onClick={()=>selectTraining(t.id)}>
              <div className="flex justify-between items-center">
                <div><div className="font-bold text-lg">{t.name}</div><div className="text-xs text-gray-500">{t.startDate} ~ {t.endDate} · {t.days}일</div></div>
                <div className="flex items-center gap-2">
                  <div className="text-right"><div className="text-2xl font-bold text-green-700">{t.participantCount||s.total}명</div><div className="text-xs text-gray-500">참가자</div></div>
                  <div className="flex flex-col gap-1 ml-2">
                    <button className="px-2 py-0.5 text-xs bg-white border rounded hover:bg-gray-100" onClick={e=>{e.stopPropagation();setEditTarget(t)}}>✏️ 수정</button>
                    <button className="px-2 py-0.5 text-xs bg-white border border-red-300 text-red-600 rounded hover:bg-red-50" onClick={e=>{e.stopPropagation();deleteTraining(t)}}>🗑️ 삭제</button>
                  </div>
                </div>
              </div>
            </div>
          )})}
        </div>
      </div>}
      {/* 준비중 연수 */}
      {preparingList.length>0&&<div className="mb-5">
        <h2 className="text-sm font-semibold text-gray-500 mb-2">🛠️ 준비중</h2>
        <div className="grid md:grid-cols-2 gap-3">
          {preparingList.map(t=>{const s=getStats(t.id);return(
            <div key={t.id} className="bg-yellow-50 border-2 border-yellow-300 rounded-xl p-4 cursor-pointer hover:-translate-y-0.5 transition-all" onClick={()=>selectTraining(t.id)}>
              <div className="flex justify-between items-center">
                <div><div className="font-bold">{t.name}</div><div className="text-xs text-gray-500">{t.startDate} ~ {t.endDate}</div></div>
                <div className="flex items-center gap-2">
                  <div className="text-right"><div className="text-lg font-bold text-yellow-700">{t.participantCount||s.total}명</div></div>
                  <div className="flex flex-col gap-1 ml-2">
                    <button className="px-2 py-0.5 text-xs bg-white border rounded hover:bg-gray-100" onClick={e=>{e.stopPropagation();setEditTarget(t)}}>✏️ 수정</button>
                    <button className="px-2 py-0.5 text-xs bg-white border border-red-300 text-red-600 rounded hover:bg-red-50" onClick={e=>{e.stopPropagation();deleteTraining(t)}}>🗑️ 삭제</button>
                  </div>
                </div>
              </div>
            </div>
          )})}
        </div>
      </div>}
      <div className="flex flex-wrap gap-3 items-center justify-between mb-4">
        <div className="flex gap-2 items-center flex-1 min-w-48">
          <input type="search" className="flex-1 px-3 py-2 border rounded-lg text-sm" placeholder="🔍 연수명 검색..." value={searchQ} onChange={e=>setSearchQ(e.target.value)}/>
          <select className="px-3 py-2 border rounded-lg text-sm" value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
            <option value="all">전체</option>
            <option value="active">진행중</option>
            <option value="preparing">준비중</option>
            <option value="completed">완료</option>
          </select>
        </div>
        <div className="flex gap-2">
          <button className="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold text-sm hover:bg-blue-700" onClick={()=>setShowCreate(true)}>➕ 새 연수</button>
          <button className="px-4 py-2 border rounded-lg text-sm font-semibold hover:bg-gray-50" onClick={()=>loadTrainings().then(()=>showToast('🔄 새로고침'))}>🔄</button>
        </div>
      </div>
      {filteredTrainings.length===0&&<div className="bg-white rounded-xl p-12 text-center text-gray-400"><div className="text-5xl mb-3">📋</div><p>{searchQ||statusFilter!=='all'?'검색 결과가 없습니다.':'등록된 연수가 없습니다.'}<br/>{!searchQ&&statusFilter==='all'&&'새 연수를 만들어보세요!'}</p></div>}
      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        {filteredTrainings.map(t=>{
          const s=getStats(t.id);
          return(
            <div key={t.id} className="bg-white rounded-xl p-5 shadow-sm border-2 border-transparent hover:border-blue-500 cursor-pointer transition-all hover:-translate-y-0.5" onClick={()=>selectTraining(t.id)}>
              <div className="flex justify-between items-start mb-2">
                <div>
                  <div className="font-bold">{t.name}</div>
                  <div className="text-xs text-gray-500 mt-1">{t.startDate} ~ {t.endDate} · {t.days}일</div>
                </div>
                <div className="flex items-center gap-2">
                  <span style={{whiteSpace:'nowrap',wordBreak:'keep-all'}} className={`text-xs px-2 py-1 rounded-full font-semibold ${t.status==='active'?'bg-green-100 text-green-800':t.status==='preparing'?'bg-yellow-100 text-yellow-800':'bg-gray-100 text-gray-600'}`}>{t.status==='active'?'진행중':t.status==='preparing'?'준비중':'완료'}</span>
                  <button className="px-1.5 py-0.5 text-xs border rounded hover:bg-gray-100" onClick={e=>{e.stopPropagation();setEditTarget(t)}} title="수정">✏️</button>
                  <button className="px-1.5 py-0.5 text-xs border border-red-300 text-red-600 rounded hover:bg-red-50" onClick={e=>{e.stopPropagation();deleteTraining(t)}} title="삭제">🗑️</button>
                </div>
              </div>
              <div className="text-sm text-gray-600">👥 참가자 <strong>{t.participantCount||s.total}명</strong></div>
            </div>
          );
        })}
      </div>
      {showCreate&&<CreateModal onClose={()=>setShowCreate(false)} onCreate={createTraining} creating={creating}/>}
      {editTarget&&<EditTrainingModal training={editTarget} onClose={()=>setEditTarget(null)} onSave={updateTraining} saving={editing}/>}
    </div>
  );
}

function EditTrainingModal({training,onClose,onSave,saving}){
  const statusMap={'active':'진행중','preparing':'준비중','completed':'완료'};
  const statusReverseMap={'준비중':'preparing','진행중':'active','완료':'completed'};
  const [name,setName]=useState(training.name||'');
  const [startDate,setStartDate]=useState(training.startDate?training.startDate.replace(/\//g,'-'):'');
  const [endDate,setEndDate]=useState(training.endDate?training.endDate.replace(/\//g,'-'):'');
  const [days,setDays]=useState(training.days||1);
  const [status,setStatus]=useState(statusMap[training.status]||'준비중');
  const [amStart,setAmStart]=useState('09:00');
  const [pmStart,setPmStart]=useState('13:00');
  const [lateMinutes,setLateMinutes]=useState(10);

  return(
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50" onClick={onClose}>
      <div className="bg-white rounded-xl p-8 max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <h2 className="text-lg font-bold mb-5">✏️ 연수 수정</h2>
        <div className="mb-4"><label className="text-sm font-semibold block mb-1">연수명 *</label><input className="w-full px-3 py-2 border rounded-lg" value={name} onChange={e=>setName(e.target.value)}/></div>
        <div className="grid grid-cols-2 gap-3 mb-4">
          <div><label className="text-sm font-semibold block mb-1">시작일</label><input type="date" className="w-full px-3 py-2 border rounded-lg" value={startDate} onChange={e=>setStartDate(e.target.value)}/></div>
          <div><label className="text-sm font-semibold block mb-1">종료일</label><input type="date" className="w-full px-3 py-2 border rounded-lg" value={endDate} onChange={e=>setEndDate(e.target.value)}/></div>
        </div>
        <div className="grid grid-cols-2 gap-3 mb-4">
          <div><label className="text-sm font-semibold block mb-1">일수</label><input type="number" min="1" max="30" className="w-full px-3 py-2 border rounded-lg" value={days} onChange={e=>setDays(Number(e.target.value))}/></div>
          <div><label className="text-sm font-semibold block mb-1">상태</label>
            <select className="w-full px-3 py-2 border rounded-lg" value={status} onChange={e=>setStatus(e.target.value)}>
              <option>준비중</option><option>진행중</option><option>완료</option>
            </select>
          </div>
        </div>
        <div className="grid grid-cols-2 gap-3 mb-4">
          <div><label className="text-sm font-semibold block mb-1">오전 시작</label><input type="time" className="w-full px-3 py-2 border rounded-lg" value={amStart} onChange={e=>setAmStart(e.target.value)}/></div>
          <div><label className="text-sm font-semibold block mb-1">오후 시작</label><input type="time" className="w-full px-3 py-2 border rounded-lg" value={pmStart} onChange={e=>setPmStart(e.target.value)}/></div>
        </div>
        <div className="mb-6"><label className="text-sm font-semibold block mb-1">지각 기준 (분)</label><input type="number" min="0" max="120" className="w-full px-3 py-2 border rounded-lg" value={lateMinutes} onChange={e=>setLateMinutes(Number(e.target.value))}/></div>
        <div className="flex gap-3 justify-end">
          <button className="px-4 py-2 border rounded-lg text-sm" onClick={onClose}>취소</button>
          <button className="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold text-sm flex items-center gap-2" disabled={!name.trim()||saving} onClick={()=>onSave({id:training.id,name:name.trim(),startDate,endDate,days,status:statusReverseMap[status]||'preparing',amStart,pmStart,lateMinutes})}>
            {saving?<><Spinner/> 저장 중...</>:'💾 저장'}
          </button>
        </div>
      </div>
    </div>
  );
}

function StatCard({title,value,icon,color}){
  const colors={blue:'text-blue-600',green:'text-green-600',red:'text-red-600',yellow:'text-yellow-600'};
  return(
    <div className="bg-white rounded-xl p-4 shadow-sm">
      <div className="text-xs text-gray-500 font-semibold">{icon} {title}</div>
      <div className={`text-3xl font-bold mt-1 ${colors[color]||'text-gray-900'}`}>{value}</div>
    </div>
  );
}

function CreateModal({onClose,onCreate,creating}){
  const [name,setName]=useState('');
  const [days,setDays]=useState(1);
  const [startDate,setStartDate]=useState('');
  const calcEndDate=()=>{
    if(!startDate||days<=1)return startDate;
    const d=new Date(startDate);let added=0;
    while(added<days-1){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)added++}
    return d.toISOString().slice(0,10);
  };

  return(
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50" onClick={onClose}>
      <div className="bg-white rounded-xl p-8 max-w-md w-full mx-4" onClick={e=>e.stopPropagation()}>
        <h2 className="text-lg font-bold mb-5">➕ 새 연수 만들기</h2>
        <div className="mb-4"><label className="text-sm font-semibold block mb-1">연수명 *</label><input className="w-full px-3 py-2 border rounded-lg" value={name} onChange={e=>setName(e.target.value)} placeholder='예: "임원 – 오프라인 제1차"'/></div>
        <div className="mb-4"><label className="text-sm font-semibold block mb-2">연수 일수 *</label>
          <div className="flex gap-2">{[1,2,3,4,5].map(d=><button key={d} className={`px-4 py-2 rounded-lg font-semibold text-sm ${days===d?'bg-blue-600 text-white':'border hover:bg-gray-50'}`} onClick={()=>setDays(d)}>{d}일</button>)}</div>
        </div>
        <div className="mb-4"><label className="text-sm font-semibold block mb-1">시작일 *</label><input type="date" className="w-full px-3 py-2 border rounded-lg" value={startDate} onChange={e=>setStartDate(e.target.value)}/>
          {startDate&&<div className="mt-2 text-sm text-blue-600 font-semibold">📅 {startDate} ~ {calcEndDate()} ({days}일간)</div>}
        </div>
        <div className="mb-6"></div>
        <div className="flex gap-3 justify-end">
          <button className="px-4 py-2 border rounded-lg text-sm" onClick={onClose}>취소</button>
          <button className="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold text-sm flex items-center gap-2" disabled={!name.trim()||!startDate||creating} onClick={()=>onCreate({name:name.trim(),days,startDate,endDate:calcEndDate()})}>
            {creating?<><Spinner/> 생성 중...</>:'✅ 생성'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   Training Dashboard
   ═══════════════════════════════════════════ */
function TrainingDash({training,participants,cards,attendanceRecords,showToast,getStats}){
  const s=getStats(training.id);

  const dayStats=Array.from({length:training.days},(_,i)=>{
    const d=i+1;
    const am=attendanceRecords.filter(a=>a.day===d&&a.session==='AM').length;
    const pm=attendanceRecords.filter(a=>a.day===d&&a.session==='PM').length;
    return{day:d,am,pm,rate:participants.length?Math.round((am+pm)/(participants.length*2)*100):0};
  });

  return(
    <div>
      <h1 className="text-2xl font-bold mb-5">📊 연수 대시보드</h1>
      <div className="bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl p-6 mb-5">
        <div className="text-sm text-blue-200">현재 연수</div>
        <div className="text-2xl font-bold mt-1">{training.name}</div>
        <div className="text-sm text-blue-200 mt-1">{training.startDate} ~ {training.endDate} · {training.days}일간</div>
        <div className="mt-3 flex gap-2">
          <span className={`text-xs px-3 py-1 rounded-full font-semibold ${training.status==='active'?'bg-green-400/30 text-green-100':training.status==='preparing'?'bg-yellow-400/30 text-yellow-100':'bg-gray-400/30 text-gray-200'}`}>{training.status==='active'?'진행중':training.status==='preparing'?'준비중':'완료'}</span>
        </div>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <StatCard title="참가자" value={s.total} icon="👥"/>
        <StatCard title="매핑률" value={`${s.mappingRate}%`} icon="🔗" color="blue"/>
        <StatCard title="출석률" value={`${s.attendanceRate}%`} icon="✅" color="green"/>
        <StatCard title="수료율" value={`${s.certRate}%`} icon="🎓" color="green"/>
      </div>
      <div className="grid grid-cols-3 gap-3 mb-5">
        <StatCard title="오늘 카드 배부" value={'-'} icon="💳" color="blue"/>
        <StatCard title="오늘 카드 반납" value={'-'} icon="↩️" color="green"/>
        <StatCard title="카드 회수율" value={'-'} icon="📊"/>
      </div>
      <div className="bg-white rounded-xl p-5 shadow-sm">
        <h3 className="text-sm font-semibold text-gray-500 mb-3">일별 출석 현황</h3>
        <table className="w-full text-sm"><thead><tr className="text-xs text-gray-500 uppercase"><th className="text-left py-2">일차</th><th>오전</th><th>오후</th><th>출석률</th></tr></thead>
          <tbody>{dayStats.map(ds=>(
            <tr key={ds.day} className="border-t"><td className="py-2 font-semibold">{ds.day}일차</td><td className="text-center">{ds.am}/{s.total}</td><td className="text-center">{ds.pm}/{s.total}</td>
              <td><div className="flex items-center gap-2"><div className="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:`${ds.rate}%`,background:ds.rate>70?'#22c55e':ds.rate>40?'#eab308':'#ef4444'}}/></div><span className="text-xs w-8">{ds.rate}%</span></div></td></tr>
          ))}</tbody>
        </table>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   Upload
   ═══════════════════════════════════════════ */
function Upload({training,participants,showToast,loadParticipants}){
  const [showQR,setShowQR]=useState(false);
  const [uploading,setUploading]=useState(false);
  const [selected,setSelected]=useState(new Set());
  const [deleting,setDeleting]=useState(false);
  const fileRef=useRef();

  const toggleSelect=(id)=>{setSelected(prev=>{const s=new Set(prev);s.has(id)?s.delete(id):s.add(id);return s})};
  const toggleAll=()=>{if(selected.size===participants.length)setSelected(new Set());else setSelected(new Set(participants.map(p=>p.id)))};
  const deleteSelected=async()=>{
    if(!selected.size)return;
    if(!confirm(`${selected.size}명을 삭제하시겠습니까?`))return;
    setDeleting(true);
    try{
      const res=await apiPost({action:'deleteParticipants',ids:[...selected]});
      if(res.status==='ok'){showToast(`🗑️ ${selected.size}명 삭제 완료`);setSelected(new Set());await loadParticipants(training.id)}
      else showToast(`❌ ${res.message||'삭제 실패'}`,'err');
    }catch(e){showToast('❌ 삭제 실패: '+e.message,'err')}
    finally{setDeleting(false)}
  };

  const handleExcel=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        let rows=XLSX.utils.sheet_to_json(ws);
        // 수강자료 엑셀: 2행이 부제목((수강자정보) 등)이면 제거
        if(rows.length&&rows[0]){const v=Object.values(rows[0]).join('');if(v.includes('수강자정보')||v.includes('전자계산서'))rows=rows.slice(1)}
        if(!rows.length){showToast('❌ 데이터가 없습니다','err');return}
        const newPs=rows.map(r=>{
          const name=r['이름']||r['name']||r['성명']||'';
          const company=r['회사']||r['회사명']||r['소속사']||r['소속']||r['company']||'';
          const position=r['직급']||r['position']||r['직위']||'';
          const phone=r['연락처']||r['연락처(무선)']||r['전화번호']||r['phone']||r['핸드폰']||'';
          const email=r['이메일']||r['email']||'';
          const manager=r['담당자']||'';
          if(!name)return null;
          // 수강자료: 취소 상태 건너뛰기
          const status=r['연수상태']||'';
          if(status==='취소')return null;
          return{이름:name.toString().trim(),회사:company.toString().trim(),직급:position.toString().trim(),연락처:phone.toString().trim(),이메일:email.toString().trim(),담당자:manager.toString().trim()};
        }).filter(Boolean);
        if(!newPs.length){showToast('❌ 유효한 참가자가 없습니다 (이름 컬럼 필요)','err');return}

        setUploading(true);
        const res=await apiPost({
          action:'uploadParticipants',
          tid:training.id,
          participants:newPs,
        });
        if(res.status==='ok'){
          showToast(`✅ ${newPs.length}명 업로드 완료!`);
          await loadParticipants(training.id);
        }else{
          showToast(`❌ ${res.message||'업로드 실패'}`,'err');
        }
      }catch(err){showToast('❌ 오류: '+err.message,'err')}
      finally{setUploading(false)}
    };
    reader.readAsArrayBuffer(file);
    e.target.value='';
  };

  const addManual=async()=>{
    const name=prompt('참가자 이름');if(!name)return;
    const company=prompt('회사')||'';
    const position=prompt('직급')||'';
    const phone=prompt('연락처')||'';
    try{
      const res=await apiPost({
        action:'uploadParticipants',
        tid:training.id,
        participants:[{이름:name.trim(),회사:company.trim(),직급:position.trim(),연락처:phone.trim(),이메일:'',담당자:''}],
      });
      if(res.status==='ok'){
        showToast(`✅ ${name} 등록`);
        await loadParticipants(training.id);
      }else showToast(`❌ ${res.message||'등록 실패'}`,'err');
    }catch(e){showToast('❌ 등록 실패','err')}
  };

  return(
    <div>
      <h1 className="text-2xl font-bold mb-5">📁 명단 업로드 & QR 생성</h1>
      <div className="bg-white rounded-xl p-6 mb-4 shadow-sm">
        <h3 className="text-sm font-semibold text-gray-500 mb-3">엑셀 파일 업로드</h3>
        <div className={`border-2 border-dashed rounded-xl p-10 text-center cursor-pointer hover:border-blue-400 transition ${uploading?'border-blue-400 bg-blue-50':'border-gray-300'}`} onClick={()=>!uploading&&fileRef.current?.click()}>
          {uploading?<><Spinner size="lg"/><div className="mt-3">업로드 중...</div></>:<>
            <div className="text-4xl mb-2">📄</div>
            <div>클릭하여 엑셀 파일 선택</div>
            <div className="text-sm text-gray-500 mt-1">.xlsx 지원 | 수강자료 엑셀 그대로 업로드 가능 (취소 건 자동 제외)</div>
          </>}
        </div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleExcel}/>
      </div>
      <div className="flex flex-wrap gap-3 items-center justify-between mb-4">
        <div className="font-semibold">등록된 참가자: {participants.length}명</div>
        <div className="flex gap-2">
          <button className="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-semibold" onClick={addManual}>➕ 수동 추가</button>
          {selected.size>0&&<button className="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-semibold" onClick={deleteSelected} disabled={deleting}>{deleting?'삭제 중...':` 🗑️ ${selected.size}명 삭제`}</button>}
          {participants.length>0&&<button className="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm font-semibold" onClick={()=>{
            const QR_BASE='https://edukosdaq-web.github.io/qr-attendance/qr.html?token=';
            const rows=participants.map(p=>({'성명':p.name,'이메일':p.email||'','휴대폰':(p.phone||'').replace(/-/g,''),'FAX번호':'','회사명':p.company||'','QR링크':QR_BASE+encodeURIComponent(p.qrCode)}));
            const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'수신자');
            XLSX.writeFile(wb,`문자발송_${training.name}_${new Date().toISOString().slice(0,10)}.xlsx`);showToast('📱 문자 발송용 엑셀 다운로드 완료');
          }}>📱 문자 발송용 엑셀</button>}
          <a href="https://www.maillink.co.kr" target="_blank" rel="noopener noreferrer" className="px-4 py-2 bg-orange-500 text-white rounded-lg text-sm font-semibold hover:bg-orange-600 inline-flex items-center gap-1">📨 메일링크 바로가기</a>
          {participants.length>0&&<button className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold" onClick={()=>setShowQR(true)}>🔲 QR코드 보기</button>}
          <button className="px-4 py-2 border rounded-lg text-sm font-semibold hover:bg-gray-50" onClick={()=>loadParticipants(training.id).then(()=>showToast('🔄 새로고침'))}>🔄</button>
        </div>
      </div>
      {participants.length>0&&<div className="bg-white rounded-xl shadow-sm overflow-x-auto">
        <table className="w-full text-sm"><thead><tr className="text-xs text-gray-500 uppercase bg-gray-50"><th className="p-3 w-10"><input type="checkbox" checked={selected.size===participants.length&&participants.length>0} onChange={toggleAll}/></th><th className="text-left p-3">#</th><th className="text-left p-3">이름</th><th className="text-left p-3">회사</th><th className="text-left p-3">직급</th><th className="text-left p-3">연락처</th><th className="text-left p-3">QR 토큰</th></tr></thead>
          <tbody>{participants.map((p,i)=>(
            <tr key={p.id} className={`border-t hover:bg-gray-50 ${selected.has(p.id)?'bg-red-50':''}`}><td className="p-3 text-center"><input type="checkbox" checked={selected.has(p.id)} onChange={()=>toggleSelect(p.id)}/></td><td className="p-3">{i+1}</td><td className="p-3 font-semibold">{p.name}</td><td className="p-3">{p.company}</td><td className="p-3">{p.position}</td><td className="p-3">{p.phone}</td>
              <td className="p-3"><code className="text-xs bg-gray-100 px-2 py-1 rounded">{p.qrCode}</code></td></tr>
          ))}</tbody>
        </table>
      </div>}
      {showQR&&<QRModal participants={participants} onClose={()=>setShowQR(false)}/>}
    </div>
  );
}

function QRModal({participants,onClose}){
  return(
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50" onClick={onClose}>
      <div className="bg-white rounded-xl p-6 max-w-3xl w-full mx-4 max-h-[80vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">🔲 참가자 QR코드</h2>
          <div className="flex gap-2">
            <button className="px-3 py-1 border rounded text-sm" onClick={()=>window.print()}>🖨️ 인쇄</button>
            <button className="px-3 py-1 border rounded text-sm" onClick={onClose}>✕ 닫기</button>
          </div>
        </div>
        <div className="grid grid-cols-3 md:grid-cols-4 gap-3">
          {participants.map(p=><QRCard key={p.id} data={p}/>)}
        </div>
      </div>
    </div>
  );
}

function QRCard({data}){
  const ref=useRef();
  useEffect(()=>{if(ref.current&&window.QRCode)QRCode.toCanvas(ref.current,data.qrCode,{width:100,margin:1}).catch(()=>{});},[data.qrCode]);
  return(
    <div className="text-center p-3 border rounded-lg">
      <canvas ref={ref} className="mx-auto" style={{maxWidth:90,maxHeight:90}}/>
      <p className="text-xs font-bold mt-1">{data.name}</p>
      <p className="text-xs text-gray-500">{data.company}</p>
    </div>
  );
}

/* ═══════════════════════════════════════════
   Mapping
   ═══════════════════════════════════════════ */
function MappingPage({training,participants,cards,showToast,showScanResult,loadCards,loadParticipants}){
  const [pQr,setPQr]=useState('');
  const [cQr,setCQr]=useState('');
  const [showManual,setShowManual]=useState(false);
  const [mapping,setMapping]=useState(false);
  const pRef=useRef();
  const cRef=useRef();

  const found=useMemo(()=>{
    if(!pQr)return null;
    const p=participants.find(x=>x.qrCode===pQr);
    return p||'notfound';
  },[pQr,participants]);

  useFocusLock(pRef,!found||found==='notfound');
  useEffect(()=>{if(found&&found!=='notfound')setTimeout(()=>cRef.current?.focus(),50)},[found]);

  const doMap=async()=>{
    if(!found||found==='notfound'||!cQr||mapping)return;
    setMapping(true);
    try{
      const res=await apiPost({action:'mapCard',cardId:cQr,participantId:found.id});
      if(res.status==='ok'){
        showScanResult('success','✅',found.name,`${cQr} 매핑 완료!`);
        await loadCards();
      }else{
        showScanResult('error','❌','매핑 실패',res.error||res.message||'알 수 없는 오류');
      }
    }catch(e){
      showScanResult('error','❌','네트워크 오류','서버 연결 실패');
    }finally{
      setMapping(false);
      setTimeout(()=>{setPQr('');setCQr('');pRef.current?.focus()},1000);
    }
  };

  const manualSelect=(p)=>{setPQr(p.qrCode);setShowManual(false)};
  const mappedCount=cards.filter(c=>c.status!=='available'&&participants.some(p=>p.id===c.participantId)).length;

  return(
    <div>
      <h1 className="text-2xl font-bold mb-5">🔗 매핑 — 참가자 ↔ 출입카드</h1>
      <div className="grid grid-cols-3 gap-3 mb-4">
        <StatCard title="총 인원" value={participants.length} icon="👥"/>
        <StatCard title="매핑 완료" value={mappedCount} icon="✅" color="green"/>
        <StatCard title="대기 중" value={participants.length-mappedCount} icon="⏳" color="yellow"/>
      </div>
      <div className="bg-yellow-50 border border-yellow-300 rounded-xl p-4 mb-4 text-sm">💡 <strong>운영 안내:</strong> 스캐너 1로 참가자 QR → 스캐너 2로 출입카드 QR 스캔. Enter로 매핑 확정.</div>
      <div className="bg-blue-50 border border-blue-300 rounded-xl p-3 mb-4 text-sm">💳 <strong>출입카드 관리:</strong> 카드 등록/삭제는 <a href="https://docs.google.com/spreadsheets/d/1cW8PARwBvDTz4Y6IXak85o-ZBRtxo_KhS1nlWy-tzzA" target="_blank" className="text-blue-600 underline">구글 시트</a>에서 직접 관리합니다.</div>
      <div className="grid md:grid-cols-2 gap-4 mb-4">
        <div className={`border-2 border-dashed rounded-xl p-6 text-center transition ${found&&found!=='notfound'?'border-green-500 bg-green-50':pQr?'border-blue-500 bg-blue-50':'border-gray-300'}`}>
          <div className="text-4xl mb-2">📱</div>
          <div className="font-bold mb-2">스캐너 1 — 참가자 QR</div>
          <input ref={pRef} type="text" inputMode="latin" autoComplete="off" autoCorrect="off" spellCheck="false" className="scanner-input w-full px-4 py-3 border rounded-lg" value={pQr} onChange={e=>setPQr(e.target.value.trim())} onKeyDown={e=>{if(e.key==='Enter'&&found&&found!=='notfound')cRef.current?.focus()}} placeholder="참가자 QR 스캔..." autoFocus/>
          <div className="mt-2 flex gap-2 justify-center">
            <button className="px-3 py-1 border rounded text-xs" onClick={()=>setShowManual(true)}>🔍 수동 검색</button>
          </div>
          {found&&found!=='notfound'&&<div className="mt-3 bg-white p-3 rounded-lg text-left"><div className="text-green-600 font-bold">✅ 본인 확인</div><div className="text-lg font-bold">{found.name} · {found.company}</div></div>}
          {found==='notfound'&&<div className="mt-2 text-red-600 font-bold">❌ 미등록 QR</div>}
        </div>
        <div className={`border-2 border-dashed rounded-xl p-6 text-center transition ${cQr?'border-blue-500 bg-blue-50':'border-gray-300'}`}>
          <div className="text-4xl mb-2">💳</div>
          <div className="font-bold mb-2">스캐너 2 — 출입카드 QR</div>
          <input ref={cRef} type="text" inputMode="latin" autoComplete="off" autoCorrect="off" spellCheck="false" className="scanner-input w-full px-4 py-3 border rounded-lg" value={cQr} onChange={e=>setCQr(e.target.value.trim())} onKeyDown={e=>{if(e.key==='Enter')doMap()}} placeholder="카드 QR 스캔..."/>
        </div>
      </div>
      <div className="text-center mb-5">
        <button className="px-8 py-4 bg-green-600 text-white text-xl rounded-xl font-bold hover:bg-green-700 disabled:opacity-50 flex items-center justify-center gap-2 mx-auto" onClick={doMap} disabled={!found||found==='notfound'||!cQr||mapping}>
          {mapping?<><Spinner/> 매핑 중...</>:'🔗 매핑 확정 (Enter)'}
        </button>
      </div>
      <div className="bg-white rounded-xl p-5 shadow-sm">
        <div className="flex justify-between items-center mb-3">
          <h3 className="text-sm font-semibold text-gray-500">매핑 내역</h3>
          <button className="text-xs border px-2 py-1 rounded hover:bg-gray-50" onClick={()=>loadCards().then(()=>showToast('🔄 새로고침'))}>🔄</button>
        </div>
        <table className="w-full text-sm"><thead><tr className="text-xs text-gray-500 uppercase bg-gray-50"><th className="text-left p-2">참가자</th><th className="text-left p-2">소속</th><th className="text-left p-2">카드 QR</th><th className="p-2">상태</th></tr></thead>
          <tbody>{participants.map(p=>{
            const c=cards.find(c=>c.participantId===p.id&&c.status!=='available');
            return <tr key={p.id} className="border-t"><td className="p-2 font-semibold">{p.name}</td><td className="p-2 text-gray-500">{p.company}</td><td className="p-2">{c?<code className="text-xs bg-gray-100 px-2 py-0.5 rounded">{c.qrCode}</code>:'-'}</td><td className="p-2 text-center">{c?<span className="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded-full">매핑</span>:<span className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">대기</span>}</td></tr>;
          })}</tbody>
        </table>
      </div>
      {showManual&&<ManualSearch participants={participants} onSelect={manualSelect} onClose={()=>setShowManual(false)}/>}
    </div>
  );
}

/* ─── Manual Search ─── */
function ManualSearch({participants,onSelect,onClose,title}){
  const [q,setQ]=useState('');
  const filtered=q.length>=1?participants.filter(p=>p.name.includes(q)||p.company.includes(q)):[];
  return(
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={onClose}>
      <div className="bg-white rounded-xl p-6 max-w-lg w-full mx-4 max-h-[80vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">{title||'🔍 수동 검색'}</h2>
          <button className="px-3 py-1 border rounded text-sm" onClick={onClose}>✕</button>
        </div>
        <input type="text" className="w-full px-4 py-3 border rounded-lg text-lg mb-3" placeholder="이름 또는 소속 검색..." value={q} onChange={e=>setQ(e.target.value)} autoFocus/>
        {q.length>=1&&filtered.length===0&&<p className="text-center text-gray-400 py-4">검색 결과 없음</p>}
        {filtered.slice(0,10).map(p=>(
          <div key={p.id} className="flex items-center justify-between p-3 border rounded-lg mt-2 cursor-pointer hover:border-blue-500 hover:bg-blue-50" onClick={()=>onSelect(p)}>
            <div><div className="font-bold">{p.name}</div><div className="text-sm text-gray-500">{p.company}</div></div>
            <button className="px-3 py-1 bg-green-600 text-white rounded text-sm">선택</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   Attendance
   ═══════════════════════════════════════════ */
function AttendancePage({training,participants,attendanceRecords,showToast,showScanResult,cards,loadAttendance,setAttendance,setCards,setParticipants,loadCards}){
  const [day,setDay]=useState(1);
  const [session,setSess]=useState('AM');
  const [qrInput,setQr]=useState('');
  const [showManual,setShowManual]=useState(false);
  const [scanning,setScanning]=useState(false);
  const lastScanTimeRef=useRef(0); // v2: QR 연속인식 방지 (0.5초 쿨다운)
  const [isFullscreen,setIsFullscreen]=useState(false); // v2: 전체화면 상태

  // v2: F11 방지 + 전체화면 토글
  useEffect(()=>{
    const handleF11=(e)=>{if(e.key==='F11'){e.preventDefault();toggleFullscreen();}};
    const handleFSChange=()=>{setIsFullscreen(!!document.fullscreenElement);};
    document.addEventListener('keydown',handleF11);
    document.addEventListener('fullscreenchange',handleFSChange);
    return()=>{document.removeEventListener('keydown',handleF11);document.removeEventListener('fullscreenchange',handleFSChange);};
  },[]);
  const toggleFullscreen=()=>{
    if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});}
    else{document.exitFullscreen().catch(()=>{});}
  };
  const inputRef=useRef();
  const scanTimerRef=useRef(null);

  useFocusLock(inputRef,!showManual&&!cardMappingTarget);

  // 카드 매핑 대기 상태: 출석 후 카드 스캔 대기
  const [cardMappingTarget,setCardMappingTarget]=useState(null); // 출석 완료된 참가자 — 카드 스캔 대기 중

  const processAttendance=async(target,method='scanner')=>{
    const existing=attendanceRecords.find(a=>a.participantId===target.id&&a.day===day&&a.session===session);
    if(existing){showScanResult('duplicate','⚠️',target.name,`이미 출석 (${new Date(existing.checkedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})})`);setQr('');return}

    // 낙관적 UI: 즉시 출석 표시
    const nowTime=new Date();
    const optimisticAtt={id:'opt_'+Date.now(),participantId:target.id,trainingId:training.id,day,session,checkedAt:nowTime.toISOString(),method,late:false};
    setAttendance(prev=>[...prev,optimisticAtt]);
    setQr('');

    // AM: 바로 카드 스캔 모달 (매일 새로 매핑)
    setCardMappingTarget(target);setQr('');

    // 백그라운드 서버 저장 (낙관적 UI 이미 반영됨, 재조회 안 함)
    try{
      const res=await apiPost({action:'scan',qrCode:target.qrCode,day,session,method});
      if(res.status!=='ok'){
        setAttendance(prev=>prev.filter(a=>a.id!==optimisticAtt.id));
        showScanResult('error','❌',target.name,res.error||res.message||'서버 저장 실패');
        setCardMappingTarget(null);
      }
    }catch(e){
      showToast('⚠️ 오프라인: '+target.name+' 출석은 로컬 저장됨');
    }
  };

  // 카드 처리: AM→매핑, PM 마지막날→반납+수료
  const processCardMapping=async(rawCardCode)=>{
    if(!cardMappingTarget)return;
    // v5.4: 한글자판 → 영문 자동변환 (전역 ko2en + KO2EN + JUNG_DECOMP/JONG_DECOMP 사용)
    // 복합 자모(ㅘ·ㅙ·ㅚ·ㅝ·ㅞ·ㅟ·ㅢ)·복합 종성(ㄳ·ㄵ·ㄶ 등)까지 decomposeKorean이 모두 분해.
    let cardCode=rawCardCode;
    if(/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(cardCode)){
      cardCode=ko2en(cardCode).toUpperCase();
      console.log('[카드] 한영변환:', rawCardCode, '→', cardCode);
    }
    // 카드 QR 검증: KOSDAQ-C- 접두사 필수
    cardCode=cardCode.toUpperCase().trim();
    if(!cardCode.startsWith('KOSDAQ-C-')){
      console.log('[카드검증실패] 입력값:', JSON.stringify(rawCardCode), '→ 변환후:', JSON.stringify(cardCode));
      showScanResult('error','⚠️','잘못된 QR',`스캔값: "${cardCode.substring(0,20)}" — 출입카드 QR(KOSDAQ-C-)이 아닙니다`);
      setQr('');
      return;
    }
    const target=cardMappingTarget;
    // target 초기화를 성공 시점까지 지연 (잘못된 카드 스캔 시 재시도 가능하도록)
    setQr('');
    
    if(session==='PM'&&isLastDay){
      // 마지막날 PM: 낙관적 UI + 수동 수료 버튼
      setCardMappingTarget(null);
      // 즉시 UI 업데이트 (낙관적)
      const optAtt={id:'opt_'+Date.now(),participantId:target.id,trainingId:training.id,day,session:'PM',checkedAt:new Date().toISOString(),method:'card-return'};
      setAttendance(prev=>[...prev,optAtt]);
      setCards(prev=>prev.map(c=>c.participantId===target.id&&c.status==='mapped'?{...c,status:'returned'}:c));
      // 낙관적: 설문+출석 조건 로컬 판단하여 즉시 수료 or 반납 표시
      const localSurveyOk=target.surveyCompleted;
      const localAttCount=curAttendance.filter(a=>a.participantId===target.id).length+1; // +1 for this PM
      const totalSessions=training.days*2;
      const localAttRate=localAttCount/totalSessions*100;
      if(localSurveyOk&&localAttRate>=80){
        setParticipants(prev=>prev.map(p=>p.id===target.id?{...p,graduated:true}:p));
        showScanResult('success','🎓',target.name,'🎓 수료 완료! (서버 저장 중…)');
      }else{
        showScanResult('success','✅',target.name,'카드 반납 + 오후 출석 완료 (서버 저장 중…)');
      }
      showToast(`💳 ${target.name} 카드 반납 — 서버 저장 중`);
      // 서버 호출 (재시도 포함)
      const doReturn=async(retry=0)=>{
        try{
          const res=await apiPost({action:'returnCard',cardId:cardCode,day:String(day)});
          console.log('[returnCard] 응답:',JSON.stringify(res));
          if(res.status==='ok'){
            const d=res.data||{};
            const graduated=d.수료?.수료처리됨||d.graduated;
            if(graduated){
              setParticipants(prev=>prev.map(p=>p.id===target.id?{...p,graduated:true,surveyCompleted:true}:p));
              showToast(`🎓 ${target.name} 수료 확정!`);
            }else if(d.수료?.미충족사유){
              const reasons=Array.isArray(d.수료.미충족사유)?d.수료.미충족사유.join(', '):String(d.수료.미충족사유);
              showScanResult('warning','⚠️',target.name,'수료 미충족: '+reasons,0,{
                label:'담당자 확인 후 수료 처리',
                action:async()=>{
                  try{
                    await apiPost({action:'markSurvey',participantId:target.id,completed:'true'});
                    await apiPost({action:'forceGraduate',participantId:target.id});
                    setParticipants(prev=>prev.map(p=>p.id===target.id?{...p,graduated:true,surveyCompleted:true}:p));
                    showScanResult('success','🎓',target.name,'🎓 수료 처리 완료! 수고하셨습니다!');
                  }catch(ex){showScanResult('error','❌',target.name,'수료 처리 오류: '+ex.message)}
                }
              });
            }
          }else{
            console.error('[returnCard] 서버 에러:',res.message);
            if(retry<2){console.log('[returnCard] 재시도',retry+1);setTimeout(()=>doReturn(retry+1),2000)}
            else{
              // v5.4: 최종 실패 시 영속 알림 — 담당자가 놓치지 않도록 모달로 표시
              showScanResult('error','⚠️',target.name,`서버 저장 실패 (3회 시도) — ${res.message||'다시 시도 필요'}`,0,{
                label:'수동 재시도',
                action:()=>doReturn(0)
              });
            }
          }
        }catch(e){
          console.error('[returnCard] 네트워크 에러:',e);
          if(retry<2){console.log('[returnCard] 재시도',retry+1);setTimeout(()=>doReturn(retry+1),2000)}
          else{
            // v5.4: 네트워크 최종 실패 시 영속 알림
            showScanResult('error','⚠️',target.name,'서버 연결 실패 (3회 시도) — 네트워크 확인 후 재시도',0,{
              label:'수동 재시도',
              action:()=>doReturn(0)
            });
          }
        }
      };
      doReturn();
    }else{
      // AM: 카드 매핑 (기존 로직)
      setCardMappingTarget(null);
      showScanResult('success','✅',target.name,'출석 완료 + 카드 매핑');
      const optimisticCard={id:'optC_'+Date.now(),qrCode:cardCode,status:'mapped',participantId:target.id,participantName:target.name,mappedAt:new Date().toISOString()};
      setCards(prev=>[...prev,optimisticCard]);
      try{
        await apiPost({action:'mapCard',cardId:cardCode,participantId:target.id,day:day,session:'AM'});
        showToast(`🔗 ${target.name} ← ${cardCode} 매핑 완료`);
      }catch(e){
        setCards(prev=>prev.filter(c=>c.id!==optimisticCard.id));
        showToast('⚠️ 카드 매핑 실패: '+e.message);
      }
    }
  };

  const isLastDay=day===training.days;

  // PM 비마지막날: 카드 QR로 직접 반납+PM출석 (낙관적 UI)
  const processCardReturnPM=async(cardCode)=>{
    // 1) 먼저 카드매핑 데이터에서 오늘 매핑된 카드 확인 (낙관적 포함)
    const cUp=cardCode.toUpperCase();
    const mapped=cards.find(c=>(c.qrCode===cardCode||c.qrCode?.toUpperCase()===cUp)&&c.status==='mapped');
    // 2) 낙관적 cards에 없으면 서버에서 확인
    if(!mapped){
      setQr('');
      showScanResult('info','⏳','확인 중','서버에서 카드 매핑 확인 중...');
      try{
        const res=await apiPost({action:'returnCard',cardId:cardCode,day:day});
        if(res.status==='ok'){
          const d=res.data||res;
          const pName=d.참가자이름||d.name||'';
          showScanResult('success','✅',pName,`오후 출석 + 카드 반납 완료`);
          showToast(`💳 ${pName} 반납 완료`);
          // 출석 낙관적 추가
          if(d.participantId){
            const optAtt={id:'opt_'+Date.now(),participantId:d.participantId,trainingId:training.id,day,session:'PM',checkedAt:new Date().toISOString(),method:'card-return'};
            setAttendance(prev=>[...prev,optAtt]);
          }
          loadCards();
        }else{
          showScanResult('error','❌','카드 오류',res.message||'오늘 매핑된 카드가 아닙니다');
        }
      }catch(e){
        showScanResult('error','❌','네트워크 오류','서버 연결 실패');
      }
      return;
    }
    // 로컬에서 찾은 경우: 기존 낙관적 UI
    const pName=participants.find(p=>p.id===mapped.participantId)?.name||'';
    showScanResult('success','✅',pName,`오후 출석 + 카드 반납`);
    showToast(`💳 ${pName} 반납 완료`);
    setCards(prev=>prev.map(c=>c.id===mapped.id?{...c,status:'returned'}:c));
    const optAtt={id:'opt_'+Date.now(),participantId:mapped.participantId,trainingId:training.id,day,session:'PM',checkedAt:new Date().toISOString(),method:'card-return'};
    setAttendance(prev=>[...prev,optAtt]);
    setQr('');
    // 백그라운드 API
    try{
      const res=await apiPost({action:'returnCard',cardId:cardCode,day:day});
      if(res.status!=='ok'){
        showScanResult('error','❌','처리 실패',res.message||'카드 반납 실패');
        setCards(prev=>prev.map(c=>c.id===mapped.id?{...c,status:'mapped'}:c));
      }
    }catch(e){
      showScanResult('error','❌','네트워크 오류','서버 연결 실패');
    }
  };

  // 한글→영문 자판 변환 (바코드 스캐너 한영전환 미스 대응)
  // 개별 자모 매핑
  const KO2EN={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p',
    'ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l',
    'ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m',
    'ㅃ':'Q','ㅉ':'W','ㄸ':'E','ㄲ':'R','ㅆ':'T','ㅒ':'O','ㅖ':'P'};
  // 완성형 한글 분해용 테이블
  const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  // 복합 자모 분해
  const JUNG_DECOMP={'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'};
  const JONG_DECOMP={'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};
  function decomposeKorean(s){
    let result='';
    for(const ch of s){
      const code=ch.charCodeAt(0);
      if(code>=0xAC00&&code<=0xD7A3){
        const offset=code-0xAC00;
        const cho=CHO[Math.floor(offset/588)];
        let jung=JUNG[Math.floor((offset%588)/28)];
        let jong=JONG[offset%28];
        result+=cho;
        result+=(JUNG_DECOMP[jung]||jung);
        if(jong)result+=(JONG_DECOMP[jong]||jong);
      }else{
        result+=ch;
      }
    }
    return result;
  }
  function ko2en(s){
    const decomposed=decomposeKorean(s);
    return decomposed.split('').map(c=>KO2EN[c]||c).join('');
  }

  const processQR=async(rawCode)=>{
    // v2: 연속인식 방지 — 0.5초 이내 재스캔 무시
    const now=Date.now();
    if(now-lastScanTimeRef.current<500){console.log('[QR] 연속인식 방지: 0.5초 쿨다운');setQr('');return;}
    lastScanTimeRef.current=now;

    let code=rawCode.replace(/[\r\n\t]/g,'').trim();
    // 한글 자판 입력 감지 시 영문 변환 (개별 자모 + 완성형 한글 모두 처리)
    if(/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(code)){code=ko2en(code);console.log('[QR] 한영변환:',rawCode,'→',code)}
    console.log('[QR] input:', JSON.stringify(code), 'len:', code.length);

    // 카드 매핑/반납 대기 중이면 카드 처리
    if(cardMappingTarget){
      processCardMapping(code);
      return;
    }

    // ── PM 비마지막날: 카드 QR만 스캔 → 반납+PM출석 ──
    if(session==='PM'&&!isLastDay){
      // 카드 QR이면 직접 반납 처리
      if(code.toUpperCase().startsWith('KOSDAQ-C')){
        processCardReturnPM(code);
        return;
      }
      // 참가자 QR이 스캔되면 안내
      const pMatch=participants.find(p=>p.qrCode===code||p.qrCode?.toUpperCase()===code.toUpperCase());
      if(pMatch){
        showScanResult('info','ℹ️',pMatch.name,'오후에는 카드 QR만 스캔하세요 (카드 반납)');
        setQr('');
        return;
      }
      // 기타: 서버에서 카드 반납 시도
      processCardReturnPM(code);
      return;
    }

    // ── PM 마지막날: 참가자 QR 먼저 → 카드 스캔 ──
    if(session==='PM'&&isLastDay){
      // 참가자 QR 찾기
      let target=participants.find(p=>p.qrCode===code||p.qrCode?.toUpperCase()===code.toUpperCase());
      if(target){
        const existing=attendanceRecords.find(a=>a.participantId===target.id&&a.day===day&&a.session==='PM');
        if(existing){showScanResult('duplicate','⚠️',target.name,'이미 오후 출석 처리됨');setQr('');return}
        setCardMappingTarget(target);setQr('');
        return;
      }
      // 카드 QR이 먼저 스캔된 경우
      if(code.toUpperCase().startsWith('KOSDAQ-C')){
        showScanResult('error','⚠️','순서 오류','마지막 날에는 참가자 QR을 먼저 스캔해주세요');
        setQr('');
        return;
      }
      showScanResult('error','❌','미등록','등록되지 않은 QR');
      setQr('');
      return;
    }

    // ── AM: 기존 로직 ──
    // v2: AM에서 카드 QR이 먼저 스캔된 경우 큰 경고
    if(session==='AM'&&code.toUpperCase().startsWith('KOSDAQ-C')){
      showScanResult('error','🚫','순서 오류!','❌ 핸드폰 QR을 먼저 스캔해주세요!\n카드는 핸드폰 QR 이후에 스캔합니다.');
      setQr('');
      return;
    }
    let target=participants.find(p=>p.qrCode===code||p.qrCode?.toUpperCase()===code.toUpperCase());
    if(!target){
      const codeUpper=code.toUpperCase();
      let card=cards.find(c=>(c.qrCode===code||c.qrCode?.toUpperCase()===codeUpper)&&c.status==='mapped');
      if(!card){try{await loadCards()}catch(e){}}
      if(card){target=participants.find(p=>p.id===card.participantId);}
      if(!target){
        setScanning(true);
        try{
          const res=await apiPost({action:'scan',qrCode:code,day,session,method:'scanner'});
          if(res.status==='ok'){
            const d=res.data||res;
            const pName=d.이름||d.name||'';
            const pCompany=d.회사||d.company||'';
            showScanResult('success','✅',pName||'출석 완료',`${pCompany} · ${day}일차 오전`);
            await loadAttendance(training.id,day);
          }else{
            showScanResult('error','❌','처리 실패',res.error||res.message||'미등록 QR');
          }
        }catch(e){
          showScanResult('error','❌','네트워크 오류','서버 연결 실패');
        }finally{setScanning(false);setQr('')}
        return;
      }
    }
    processAttendance(target);
  };

  const present=attendanceRecords.filter(a=>a.day===day&&a.session===session);

  // Load attendance on mount + when day changes
  useEffect(()=>{loadAttendance(training.id);loadCards()},[]);
  useEffect(()=>{loadAttendance(training.id,day)},[day]);

  return(
    <div style={{background:'#e5e5ea',minHeight:'100vh',padding:24,fontFamily:'-apple-system,BlinkMacSystemFont,Pretendard,SUIT,"Noto Sans KR",sans-serif',display:'flex',flexDirection:'column'}}>
      {/* ── 상단 어드민 바 ── */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24,background:'#fff',padding:16,borderRadius:24,boxShadow:'0 1px 2px rgba(0,0,0,0.04)',border:'1px solid #f1f5f9'}}>
        <div style={{display:'flex',alignItems:'center',gap:16}}>
          <h1 style={{fontSize:20,fontWeight:700,color:'#0f172a',letterSpacing:'-0.025em',marginLeft:8}}>출석 스캐너 모드</h1>
          <div style={{height:24,width:1,background:'#e2e8f0'}}/>
          {/* 일차 토글 */}
          <div style={{display:'flex',alignItems:'center',background:'#f5f5f7',borderRadius:12,padding:4}}>
            {Array.from({length:training.days},(_,i)=>i+1).map(d=>(
              <button key={d} onClick={()=>setDay(d)}
                style={{padding:'6px 16px',borderRadius:8,fontSize:14,fontWeight:600,border:'none',cursor:'pointer',transition:'all .15s',
                  background:day===d?'#fff':'transparent',
                  color:day===d?'#0f172a':'#64748b',
                  boxShadow:day===d?'0 1px 2px rgba(0,0,0,0.04)':'none'}}>{d}일차</button>
            ))}
          </div>
          {/* 세션 토글 */}
          <div style={{display:'flex',alignItems:'center',background:'#f5f5f7',borderRadius:12,padding:4,marginLeft:8}}>
            <button onClick={()=>setSess('AM')}
              style={{padding:'6px 16px',borderRadius:8,fontSize:14,fontWeight:600,border:'none',cursor:'pointer',transition:'all .15s',
                background:session==='AM'?'#f04e23':'transparent',
                color:session==='AM'?'#fff':'#64748b',
                boxShadow:session==='AM'?'0 1px 2px rgba(0,0,0,0.04)':'none'}}>오전 입실</button>
            <button onClick={()=>setSess('PM')}
              style={{padding:'6px 16px',borderRadius:8,fontSize:14,fontWeight:600,border:'none',cursor:'pointer',transition:'all .15s',
                background:session==='PM'?'#f58220':'transparent',
                color:session==='PM'?'#fff':'#64748b',
                boxShadow:session==='PM'?'0 1px 2px rgba(0,0,0,0.04)':'none'}}>오후 퇴실</button>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:11,color:'#94a3b8',fontWeight:500}}>출석률</div>
            <div style={{fontSize:20,fontWeight:800,color:'#f04e23',letterSpacing:'-0.025em'}}>{present.length}<span style={{color:'#cbd5e1',fontSize:14,fontWeight:600}}> / {participants.length}</span></div>
          </div>
          <button onClick={toggleFullscreen}
            style={{display:'inline-flex',alignItems:'center',gap:8,padding:'8px 16px',background:'#fff',border:'1px solid #e2e8f0',color:'#64748b',borderRadius:12,fontSize:13,fontWeight:600,cursor:'pointer'}}>
            {isFullscreen?'🔙 전체화면 해제':'🖥️ 전체화면'}
          </button>
        </div>
      </div>

      {/* ── 메인 그리드 (좌 3 : 우 1) ── */}
      <div style={{display:'grid',gridTemplateColumns:'3fr 1fr',gap:24,alignItems:'stretch',flex:1,minHeight:0}}>
        {/* ── 좌측 ── */}
        <div style={{display:'flex',flexDirection:'column',gap:24,minHeight:0}}>

          {/* 메인 안내 카드 — 남는 공간 다 차지 (스캐너 카드만 고정) */}
          <div style={{flex:1,background:'#fff',borderRadius:32,boxShadow:'0 4px 30px rgba(0,0,0,0.04)',padding:48,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',position:'relative',overflow:'hidden',minHeight:560}}>
            {/* 그라데이션 상단 border */}
            <div style={{position:'absolute',top:0,left:0,right:0,height:12,background:'linear-gradient(90deg,#f04e23,#f58220,#f5f5f7)'}}/>

            {/* Day / 세션 칩 */}
            <div style={{position:'absolute',top:32,left:32}}>
              <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',padding:'10px 20px',background:'#f5f5f7',color:'#334155',borderRadius:16,fontWeight:700,fontSize:18,letterSpacing:'-0.025em'}}>
                Day {day} / {session==='AM'?'오전 (AM)':'오후 (PM)'}
              </span>
            </div>

            {/* 세션별 안내 콘텐츠 (lucide-style 라인 아이콘) */}
            {session==='AM'&&(
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',textAlign:'center',gap:40}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:40,color:'#f04e23'}}>
                  <svg width={200} height={200} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                  <span style={{fontSize:80,color:'#cbd5e1',fontWeight:300}}>+</span>
                  <svg width={200} height={200} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:16}}>
                  <h2 style={{fontSize:48,fontWeight:800,color:'#0f172a',letterSpacing:'-0.025em',lineHeight:1.15,margin:0}}>
                    <span style={{color:'#f04e23'}}>핸드폰 QR</span> 화면을 먼저 찍고<br/>이어서 <span style={{color:'#f04e23'}}>출입 카드</span>를 찍어주세요
                  </h2>
                  <p style={{fontSize:22,color:'#64748b',fontWeight:500,margin:0}}>오전 입실 출석체크가 완료됩니다.</p>
                </div>
              </div>
            )}
            {!isLastDay&&session==='PM'&&(
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',textAlign:'center',gap:40}}>
                <div style={{color:'#f58220'}}>
                  <svg width={240} height={240} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:16}}>
                  <h2 style={{fontSize:48,fontWeight:800,color:'#0f172a',letterSpacing:'-0.025em',lineHeight:1.15,margin:0}}>
                    오후 퇴실 시에는<br/><span style={{color:'#f58220'}}>출입 카드</span>만 찍고 퇴실하시면 됩니다
                  </h2>
                  <p style={{fontSize:22,color:'#64748b',fontWeight:500,margin:0}}>핸드폰 QR은 필요하지 않습니다.</p>
                </div>
              </div>
            )}
            {isLastDay&&session==='PM'&&(
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',textAlign:'center',gap:40}}>
                <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:32}}>
                  <div style={{background:'#fff0ed',padding:32,borderRadius:'50%',color:'#f04e23',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <svg width={120} height={120} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v0z"/><path d="M9 14l2 2 4-4"/></svg>
                  </div>
                  <span style={{fontSize:56,color:'#cbd5e1',fontWeight:300}}>→</span>
                  <div style={{background:'#f8fafc',padding:32,borderRadius:'50%',color:'#334155',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <svg width={110} height={110} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                  </div>
                  <span style={{fontSize:56,color:'#cbd5e1',fontWeight:300}}>+</span>
                  <div style={{background:'#f8fafc',padding:32,borderRadius:'50%',color:'#334155',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <svg width={110} height={110} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                  </div>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:20}}>
                  <h2 style={{fontSize:48,fontWeight:800,color:'#0f172a',letterSpacing:'-0.025em',lineHeight:1.15,margin:0}}>
                    <span style={{color:'#f04e23'}}>설문조사 완료 후</span> 생성된 핸드폰 QR과<br/>출입 카드를 모두 찍어야 수료됩니다
                  </h2>
                </div>
              </div>
            )}
          </div>

          {/* 스캐너 입력 영역 */}
          <div style={{background:'#fff',borderRadius:24,boxShadow:'0 4px 20px rgba(0,0,0,0.03)',padding:24,display:'flex',alignItems:'center',gap:24,flexShrink:0}}>
            <div style={{width:48,height:48,borderRadius:16,background:'#f5f5f7',display:'flex',alignItems:'center',justifyContent:'center',color:'#94a3b8',fontSize:24,flexShrink:0}}>📲</div>
            <div style={{flex:1}}>
              <p style={{fontSize:14,fontWeight:600,color:'#64748b',marginBottom:8,letterSpacing:'-0.025em',margin:0}}>스캐너 대기 중...</p>
              <input ref={inputRef} type="text" inputMode="latin" autoComplete="off" autoCorrect="off" spellCheck="false"
                style={{height:48,fontSize:18,fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace',background:'#f5f5f7',border:'none',borderRadius:12,width:'100%',padding:'0 16px',outline:'none'}}
                className="scanner-input"
                value={qrInput}
