<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>코스닥협회 출석 QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:40px 30px;max-width:380px;width:100%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.org{color:#888;font-size:13px;margin-bottom:4px}
.title{font-size:20px;font-weight:700;margin-bottom:24px}
.qr-wrap{background:#fff;border:3px solid #e8e8e8;border-radius:16px;padding:20px;display:inline-block;margin-bottom:12px}
.token{color:#999;font-size:11px;word-break:break-all;margin-bottom:20px}
.info{background:#f8f9fa;border-radius:12px;padding:14px;text-align:left;font-size:13px;color:#555;line-height:1.7}
.info strong{color:#333}
.tip{margin-top:16px;background:#fffbe6;border:1px solid #ffe58f;border-radius:10px;padding:10px 14px;font-size:12px;color:#ad8b00}
.error{color:#e74c3c;font-size:15px;line-height:1.8;padding:20px 0}
/* 설문 안내 */
.survey-block{padding:20px 0}
.survey-icon{font-size:48px;margin-bottom:12px}
.survey-msg{font-size:16px;font-weight:600;color:#d97706;margin-bottom:8px}
.survey-sub{font-size:13px;color:#666;margin-bottom:20px;line-height:1.6}
.survey-btn{display:inline-block;background:#2563eb;color:#fff;font-size:16px;font-weight:600;padding:14px 32px;border-radius:12px;text-decoration:none;margin-bottom:12px}
.survey-btn:hover{background:#1d4ed8}
.refresh-btn{display:inline-block;background:#f3f4f6;color:#374151;font-size:13px;font-weight:500;padding:10px 24px;border-radius:8px;text-decoration:none;cursor:pointer;border:1px solid #d1d5db}
.refresh-btn:hover{background:#e5e7eb}
.name-tag{font-size:18px;font-weight:700;color:#1f2937;margin-bottom:4px}
.company-tag{font-size:13px;color:#6b7280;margin-bottom:16px}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="org">코스닥협회</div>
  <div class="title">출석 QR코드</div>
  <div id="content">
    <div style="padding:20px 0;color:#999">확인 중...</div>
  </div>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbz5sEyjgPzbzSGEQl9q3tI2_wJv5zX5YuAYkXpLM8ThsF3yJS6FaksEVl0CCl7R3dFP/exec';
const params=new URLSearchParams(location.search);
const token=params.get('token');
const content=document.getElementById('content');

const CACHE_KEY='qr_cache_'+token;

if(!token){
  content.innerHTML='<div class="error">QR 토큰이 없습니다.<br>문자에서 링크를 다시 확인해주세요.</div>';
}else{
  // v5.3: 캐시 우선 표시 + 조건부 API 호출 최적화
  const cached = readCache();
  showCachedOrLoading(cached);
  // 최근 1시간 내 캐시 + 비마지막날 → 서버 호출 생략 (평일 로드 즉시 완료)
  if (cached && cached._ts && (Date.now() - cached._ts) < 3600000 && cached.isLastDay === false) {
    console.log('[qr] 비마지막날 캐시 히트, API 호출 스킵');
  } else {
    checkAccess();
  }
}

function readCache(){
  try { return JSON.parse(localStorage.getItem(CACHE_KEY)); }
  catch(e) { return null; }
}

function showCachedOrLoading(cached){
  try{
    if(cached&&cached.이름){
      // 캐시에서 이름/회사 즉시 표시
      let nameHtml='<div class="name-tag">'+escHtml(cached.이름)+'</div>';
      if(cached.회사) nameHtml+='<div class="company-tag">'+escHtml(cached.회사)+'</div>';
      // 마지막날이 아니었거나 설문완료 상태면 QR 즉시 표시
      if(!cached.isLastDay||cached.surveyCompleted||cached.allowed){
        content.innerHTML=nameHtml+
          '<div class="qr-wrap"><canvas id="qr"></canvas></div>'+
          '<div class="token">'+escHtml(token)+'</div>'+
          '<div style="color:#999;font-size:11px;margin-bottom:12px">서버 확인 중...</div>'+
          '<div class="info">📋 <strong>안내</strong><br>• 현장 입구에서 이 화면을 보여주세요.<br>• 화면 밝기를 최대로 올려주세요.</div>';
        QRCode.toCanvas(document.getElementById('qr'),token,{width:220,margin:2}).catch(()=>{});
      }else{
        // 마지막날 + 설문 미완료 → QR 표시 안 하고 로딩만
        content.innerHTML=nameHtml+
          '<div style="padding:20px 0;color:#666;font-size:14px">📝 서버에서 설문 완료 여부 확인 중...</div>';
      }
      return;
    }
  }catch(e){}
  // 캐시 없으면 로딩 표시
  content.innerHTML='<div style="padding:20px 0;color:#999">확인 중...</div>';
}

async function checkAccess(){
  try{
    const res=await fetch(API_URL+'?action=checkQRAccess&token='+encodeURIComponent(token),{redirect:'follow'});
    const json=await res.json();

    if(json.status==='ok'&&json.data){
      const d=json.data;
      // v2: 캐시 저장
      try{d._ts=Date.now();localStorage.setItem(CACHE_KEY,JSON.stringify(d));}catch(e){}
      if(d.allowed){
        showQR(d);
      }else{
        showSurveyRequired(d);
      }
    }else{
      // API 에러 → 폴백: QR 표시
      showQRFallback();
    }
  }catch(e){
    // 네트워크 오류 → 폴백: QR 표시
    showQRFallback();
  }
}

function showQR(data){
  let nameHtml='';
  if(data.이름){
    nameHtml='<div class="name-tag">'+escHtml(data.이름)+'</div>';
    if(data.회사) nameHtml+='<div class="company-tag">'+escHtml(data.회사)+'</div>';
  }
  // 설문 안내 배너
  let surveyBanner='';
  const surveyLink=data.surveyPageUrl||data.surveyUrl;
  if(data.isLastDay&&!data.surveyCompleted&&surveyLink){
    if(data.amChecked){
      // AM 출석 완료 후: 설문 강제 안내 (곧 블로킹됨)
      surveyBanner='<div style="background:#fef3c7;border:2px solid #f59e0b;border-radius:12px;padding:16px;margin-bottom:16px;text-align:center">'+
        '<div style="font-size:16px;font-weight:700;color:#d97706;margin-bottom:8px">📝 설문조사를 완료해주세요!</div>'+
        '<div style="font-size:13px;color:#92400e;margin-bottom:12px;line-height:1.6">오후 퇴실 시 설문 완료 후 QR을 보여주셔야<br>수료 처리가 됩니다.</div>'+
        '<a href="'+escHtml(surveyLink)+'" target="_blank" style="display:inline-block;background:#2563eb;color:#fff;font-size:16px;font-weight:600;padding:12px 28px;border-radius:12px;text-decoration:none">📝 설문조사 바로가기</a>'+
        '</div>';
    }else{
      // AM 출석 전: 미리 설문하기 버튼 (선택)
      surveyBanner='<div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:12px 16px;margin-bottom:16px;text-align:center">'+
        '<div style="font-size:13px;color:#0369a1;margin-bottom:8px">💡 시간이 되시면 미리 설문을 완료해주세요</div>'+
        '<a href="'+escHtml(surveyLink)+'" target="_blank" style="display:inline-block;background:#0ea5e9;color:#fff;font-size:14px;font-weight:600;padding:8px 20px;border-radius:8px;text-decoration:none">미리 설문하러 가기</a>'+
        '</div>';
    }
  }else if(data.isLastDay&&!data.surveyCompleted&&data.hasSurvey){
    // 설문 URL은 없지만 설문 있음 — surveyPageUrl 사용
    surveyBanner='<div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:12px 16px;margin-bottom:16px;text-align:center">'+
      '<div style="font-size:13px;color:#0369a1">💡 설문조사가 준비되어 있습니다</div>'+
      '</div>';
  }
  content.innerHTML=nameHtml+surveyBanner+
    '<div class="qr-wrap"><canvas id="qr"></canvas></div>'+
    '<div class="token">'+escHtml(token)+'</div>'+
    '<div class="info">📋 <strong>안내</strong><br>• 현장 입구에서 이 화면을 보여주세요.<br>• 화면 밝기를 최대로 올려주세요.<br>• 이 페이지를 즐겨찾기 해두시면 편리합니다.</div>'+
    '<div class="tip">💡 스캔이 안 되면 화면 밝기를 최대로 올려주세요</div>';
  QRCode.toCanvas(document.getElementById('qr'),token,{width:220,margin:2}).catch(()=>{});
}

function showQRFallback(){
  content.innerHTML=
    '<div class="qr-wrap"><canvas id="qr"></canvas></div>'+
    '<div class="token">'+escHtml(token)+'</div>'+
    '<div class="info">📋 <strong>안내</strong><br>• 현장 입구에서 이 화면을 보여주세요.<br>• 화면 밝기를 최대로 올려주세요.<br>• 이 페이지를 즐겨찾기 해두시면 편리합니다.</div>'+
    '<div class="tip">💡 스캔이 안 되면 화면 밝기를 최대로 올려주세요</div>';
  QRCode.toCanvas(document.getElementById('qr'),token,{width:220,margin:2}).catch(()=>{});
}

function showSurveyRequired(data){
  let nameHtml='';
  if(data.이름){
    nameHtml='<div class="name-tag">'+escHtml(data.이름)+'</div>';
    if(data.회사) nameHtml+='<div class="company-tag">'+escHtml(data.회사)+'</div>';
  }
  content.innerHTML=nameHtml+
    '<div class="survey-block">'+
      '<div class="survey-icon">📝</div>'+
      '<div class="survey-msg">설문조사를 먼저 완료해주세요</div>'+
      '<div class="survey-sub">설문조사를 완료해야<br>QR코드가 표시됩니다.<br><br><span style="font-size:12px;color:#999">※ 설문 시 입력하신 이름은 출석 확인 후<br>암호화 처리되어 설문 응답자는 확인되지 않습니다.</span></div>'+
      ((data.surveyPageUrl||data.surveyUrl)?'<a class="survey-btn" href="'+escHtml(data.surveyPageUrl||data.surveyUrl)+'" target="_blank">📝 설문조사 바로가기</a><br><br>':'')+
      '<span class="survey-btn" style="background:#22c55e;cursor:pointer" id="surveyDoneBtn">✅ 설문 완료했어요</span>'+
    '</div>';
  // 설문 탭에서 돌아오면 자동 재확인
  window.addEventListener('focus',function onFocus(){
    window.removeEventListener('focus',onFocus);
    const btn=document.getElementById('surveyDoneBtn');
    if(btn) btn.click();
  });
  document.getElementById('surveyDoneBtn').onclick=async function(){
    this.textContent='확인 중...';this.style.opacity='0.6';this.style.pointerEvents='none';
    // markSurvey 호출하지 않음 — 관리자가 설문 완료 처리해야 QR 표시
    // checkQRAccess만 재확인
    try{
      const res=await fetch(API_URL+'?action=checkQRAccess&token='+encodeURIComponent(token),{redirect:'follow'});
      const json=await res.json();
      if(json.status==='ok'&&json.data&&json.data.allowed){
        showQR(json.data);
      }else{
        this.textContent='❌ 설문이 아직 확인되지 않았습니다';this.style.background='#ef4444';this.style.opacity='1';
        setTimeout(()=>{this.textContent='✅ 설문 완료했어요';this.style.background='#22c55e';this.style.opacity='1';this.style.pointerEvents='auto'},3000);
      }
    }catch(e){
      // 네트워크 오류 시 폴백으로 QR 표시
      showQRFallback();
    }
  };
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
</script>
</body>
</html>
